id: apps.edge-inline-compose
title: 'Встроенное написание текста в Edge'
category: apps
subcategory: edge-ai
kind: setting
summary: 'Управляет ИИ-командой написания и переработки текста в полях веб-страниц.'
explanation:
  purpose: 'Позволяет отдельно отключить встроенный помощник Compose в Microsoft Edge.'
  mechanism: 'Политика ComposeInlineEnabled задаёт доступность команды Compose непосредственно в полях ввода.'
  effect: 'При отключении Edge не предлагает генерацию и переписывание текста в полях страниц.'
  tradeoffs: 'Обычный ввод текста не меняется, но ИИ-помощник становится недоступен.'
  recommendation: 'Отключайте, если встроенный Compose не используется.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\ComposeInlineEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: ComposeInlineEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: ComposeInlineEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: ComposeInlineEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
