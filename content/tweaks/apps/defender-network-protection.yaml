id: apps.defender-network-protection
title: Сетевая защита Microsoft Defender
category: apps
subcategory: defender
kind: setting
summary: Проверяет обращения приложений к адресам с низкой репутацией.
explanation: {purpose: 'Управляет сетевой защитой Defender.', mechanism: 'EnableNetworkProtection задаёт выключенный, блокирующий или аудиторский режим.', effect: 'Блокировка запрещает опасные подключения; аудит только регистрирует их.', tradeoffs: 'Блокировка может затронуть внутренние или недавно созданные сайты.', recommendation: 'Сначала используйте аудит, затем блокировку.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection\EnableNetworkProtection: 0, 1 или 2.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 14393}
states:
  disabled: {title: Выключено, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection', value_name: EnableNetworkProtection, view: registry64, value: 0}]}
  block: {title: Блокировать, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection', value_name: EnableNetworkProtection, view: registry64, value: 1}]}
  audit: {title: Только аудит, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection', value_name: EnableNetworkProtection, view: registry64, value: 2}]}
windows_defaults: [{os: windows10, builds: [14393, 19045], state: disabled}, {os: windows11, builds: [22000, 26200], state: disabled}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection', value_name: EnableNetworkProtection, view: registry64, states: {0: disabled, 1: block, 2: audit}, missing_state: disabled}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
