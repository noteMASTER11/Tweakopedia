id: apps.paint-image-creator
title: 'Создание изображений в Paint'
category: apps
subcategory: ai
kind: setting
summary: 'Управляет встроенным средством создания изображений в Paint.'
explanation:
  purpose: 'Позволяет убрать отдельную команду создания изображений, сохранив остальные возможности приложения.'
  mechanism: 'Политика DisableImageCreator задаёт доступность Image Creator в Paint.'
  effect: 'При отключении команда создания изображений больше не предлагается.'
  tradeoffs: 'Создание изображений по запросу станет недоступно; локальное редактирование не изменится.'
  recommendation: 'Отключайте, если не пользуетесь Image Creator.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint\DisableImageCreator: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22621
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
        value_name: DisableImageCreator
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
        value_name: DisableImageCreator
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22621, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
  value_name: DisableImageCreator
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
