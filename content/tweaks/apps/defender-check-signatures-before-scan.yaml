explanation: {purpose: 'Обновляет данные обнаружения перед плановой проверкой.', mechanism: 'CheckForSignaturesBeforeRunningScan включает предварительную проверку обновлений.', effect: 'Плановое сканирование начинается после попытки получить свежие сигнатуры.', tradeoffs: 'Запуск проверки может задержаться и потребовать сетевого соединения.', recommendation: 'Включите для регулярно подключённого к сети ПК.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\Scan\CheckForSignaturesBeforeRunningScan.'}
