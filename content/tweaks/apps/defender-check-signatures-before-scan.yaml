  enabled: {title: Включено, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\Scan', value_name: CheckForSignaturesBeforeRunningScan, view: registry64, value: 1}]}
