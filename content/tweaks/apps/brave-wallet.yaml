id: apps.brave-wallet
title: 'Кошелёк Brave Wallet'
category: apps
subcategory: brave
kind: setting
summary: 'Управляет встроенным криптовалютным кошельком Brave.'
explanation:
  purpose: 'Позволяет отдельно включить или отключить Brave Wallet политикой браузера.'
  mechanism: 'DWORD BraveWalletDisabled в разделе политик Brave принудительно задаёт состояние функции.'
  effect: 'При отключении интерфейс и функции Brave Wallet скрываются.'
  tradeoffs: 'Встроенный кошелёк нельзя будет использовать.'
  recommendation: 'Отключайте, если криптовалютные функции браузера не нужны.'
  technical_details: 'DWORD HKLM\Software\Policies\BraveSoftware\Brave\BraveWalletDisabled: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
  required_components: [brave]
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\BraveSoftware\Brave'
        value_name: BraveWalletDisabled
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\BraveSoftware\Brave'
        value_name: BraveWalletDisabled
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\BraveSoftware\Brave'
  value_name: BraveWalletDisabled
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
