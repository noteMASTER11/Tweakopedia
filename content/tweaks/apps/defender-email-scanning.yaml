id: apps.defender-email-scanning
title: 'Проверка почтовых файлов Defender'
category: apps
subcategory: defender
kind: setting
summary: 'Управляет анализом поддерживаемых локальных форматов почтовых ящиков и вложений.'
explanation:
  purpose: 'Управляет анализом поддерживаемых локальных форматов почтовых ящиков и вложений.'
  mechanism: 'DisableEmailScanning переключает разбор PST, DBX, MIME и некоторых устаревших почтовых форматов.'
  effect: 'При включении содержимое поддерживаемых локальных почтовых файлов включается в проверку.'
  tradeoffs: 'Современные почтовые клиенты этим режимом не поддерживаются; обработка больших PST может быть долгой.'
  recommendation: 'Включайте только при работе с поддерживаемыми локальными архивами почты.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\Scan\DisableEmailScanning.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 14393
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender\Scan'
        value_name: DisableEmailScanning
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender\Scan'
        value_name: DisableEmailScanning
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [14393, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows Defender\Scan'
  value_name: DisableEmailScanning
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
