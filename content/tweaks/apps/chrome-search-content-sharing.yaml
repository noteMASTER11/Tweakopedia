id: apps.chrome-search-content-sharing
title: 'Передача содержимого в ИИ-поиск Chrome'
category: apps
subcategory: chrome-ai
kind: setting
summary: 'Управляет передачей содержимого страниц и файлов интеграциям Google AI Mode и Lens.'
explanation:
  purpose: 'Управляет передачей содержимого страниц и файлов интеграциям Google AI Mode и Lens.'
  mechanism: 'Windows или приложение читает DWORD SearchContentSharingSettings и применяет соответствующий режим.'
  effect: 'При запрете интеграции поиска не получают содержимое открытых вкладок и файлов через этот механизм.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Запрещайте, если анализ содержимого в AI Mode и Lens не используется.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Google\Chrome\SearchContentSharingSettings: 1 — запретить, 0 — разрешить.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
  required_components: [chrome]
states:
  disabled:
    title: 'Запретить'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Google\Chrome'
        value_name: SearchContentSharingSettings
        view: registry64
        value: 1
  enabled:
    title: 'Разрешить'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Google\Chrome'
        value_name: SearchContentSharingSettings
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Google\Chrome'
  value_name: SearchContentSharingSettings
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
