id: apps.click-to-do-user
title: 'Click to Do для текущего пользователя'
category: apps
subcategory: ai
kind: setting
summary: 'Управляет функцией Click to Do в профиле текущего пользователя.'
explanation:
  purpose: 'Позволяет запретить анализ содержимого экрана и предлагаемые действия только для текущего профиля.'
  mechanism: 'Пользовательская политика DisableClickToDo задаёт доступность Click to Do.'
  effect: 'При отключении Click to Do не запускается для текущего пользователя.'
  tradeoffs: 'Контекстные действия над текстом и изображениями на экране станут недоступны.'
  recommendation: 'Используйте пользовательскую политику, если настройка не должна затрагивать другие профили.'
  technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows\WindowsAI\DisableClickToDo: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22621
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\WindowsAI'
        value_name: DisableClickToDo
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\WindowsAI'
        value_name: DisableClickToDo
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22621, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Policies\Microsoft\Windows\WindowsAI'
  value_name: DisableClickToDo
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
