id: apps.defender-pua-protection
title: 'Нежелательные приложения в Defender'
category: apps
subcategory: defender
kind: setting
summary: 'Выбирает реакцию Defender на потенциально нежелательные приложения.'
explanation:
  purpose: 'Выбирает реакцию Defender на потенциально нежелательные приложения.'
  mechanism: 'PUAProtection задаёт выключенный, блокирующий или аудиторский режим обнаружения PUA.'
  effect: 'Блокирующий режим останавливает найденные приложения; аудит только записывает событие.'
  tradeoffs: 'Под определение PUA могут попадать упаковщики, рекламные установщики и утилиты, которые пользователь намеренно запускает.'
  recommendation: 'Для обычного ПК используйте блокировку; аудит полезен перед развёртыванием правила на нескольких устройствах.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\PUAProtection: 0 — выключено, 1 — блокировать, 2 — аудит.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 14393
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender'
        value_name: PUAProtection
        view: registry64
        value: 0
  block:
    title: 'Блокировать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender'
        value_name: PUAProtection
        view: registry64
        value: 1
  audit:
    title: 'Только аудит'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender'
        value_name: PUAProtection
        view: registry64
        value: 2
windows_defaults:
  - os: windows10
    builds: [14393, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows Defender'
  value_name: PUAProtection
  view: registry64
  states:
    0: disabled
    1: block
    2: audit
  missing_state: disabled
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
