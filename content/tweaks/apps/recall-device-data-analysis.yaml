id: apps.recall-device-data-analysis
title: 'Анализ данных Recall для компьютера'
category: apps
subcategory: ai
kind: setting
summary: 'Управляет анализом данных Windows Recall для всех пользователей.'
explanation:
  purpose: 'Позволяет централизованно запретить обработку данных Recall на устройстве.'
  mechanism: 'Компьютерная политика DisableAIDataAnalysis применяется ко всем профилям.'
  effect: 'При отключении анализ Recall блокируется на уровне компьютера.'
  tradeoffs: 'Зависящие от анализа функции Recall будут недоступны всем пользователям.'
  recommendation: 'Используйте для единого состояния Recall на компьютере.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22621
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
        value_name: DisableAIDataAnalysis
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
        value_name: DisableAIDataAnalysis
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22621, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
  value_name: DisableAIDataAnalysis
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
