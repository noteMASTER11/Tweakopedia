id: apps.edge-copilot-page-data
title: 'Доступ Copilot CDP к данным страницы Edge'
category: apps
subcategory: edge-ai
kind: setting
summary: 'Управляет доступом Copilot к данным страницы через механизм CDP в Edge.'
explanation:
  purpose: 'Позволяет отдельно ограничить расширенный сбор контекста страницы для Copilot.'
  mechanism: 'Политика CopilotCDPPageContext задаёт доступ к данным страницы через интерфейс браузера.'
  effect: 'При отключении Copilot не получает расширенный контекст страницы этим способом.'
  tradeoffs: 'Некоторые контекстные функции Copilot в Edge могут стать недоступны.'
  recommendation: 'Отключайте, если расширенная интеграция Copilot со страницами не нужна.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\CopilotCDPPageContext: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: CopilotCDPPageContext
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: CopilotCDPPageContext
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: CopilotCDPPageContext
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
