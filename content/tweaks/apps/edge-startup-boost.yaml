id: apps.edge-startup-boost
title: 'Ускорение запуска Microsoft Edge'
category: apps
subcategory: edge-ui
kind: setting
summary: 'Управляет предварительным запуском процессов Edge при входе в Windows.'
explanation:
  purpose: 'Управляет предварительным запуском процессов Edge при входе в Windows.'
  mechanism: 'Windows или приложение читает DWORD StartupBoostEnabled и применяет соответствующий режим.'
  effect: 'При включении часть процессов Edge остаётся готовой в фоне, сокращая время открытия браузера.'
  tradeoffs: 'Ускорение запуска использует часть памяти до открытия окна браузера.'
  recommendation: 'Оставляйте включённым при частом использовании Edge; отключайте для уменьшения фоновых процессов.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\StartupBoostEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
  required_components: [edge]
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: StartupBoostEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: StartupBoostEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: StartupBoostEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
