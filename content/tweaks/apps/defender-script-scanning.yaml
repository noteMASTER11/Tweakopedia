id: apps.defender-script-scanning
title: 'Проверка сценариев Defender'
category: apps
subcategory: defender
kind: setting
summary: 'Управляет анализом PowerShell, JavaScript и других поддерживаемых сценариев.'
explanation:
  purpose: 'Управляет анализом PowerShell, JavaScript и других поддерживаемых сценариев.'
  mechanism: 'DisableScriptScanning переключает анализ содержимого сценариев перед выполнением.'
  effect: 'При включении Defender проверяет команды и сценарии, передаваемые поддерживаемым интерпретаторам.'
  tradeoffs: 'Если включена системная защита параметров Defender, локальная политика может быть принята не сразу или переопределена.'
  recommendation: 'Отключайте проверку только для воспроизводимого теста; для постоянного исключения лучше использовать точечное исключение.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\Real-Time Protection\DisableScriptScanning.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 14393
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender\Real-Time Protection'
        value_name: DisableScriptScanning
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender\Real-Time Protection'
        value_name: DisableScriptScanning
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [14393, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows Defender\Real-Time Protection'
  value_name: DisableScriptScanning
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
