id: apps.defender-user-interface
title: Интерфейс Microsoft Defender
category: apps
subcategory: defender
kind: setting
summary: Показывает или скрывает пользовательский интерфейс Defender.
explanation: {purpose: 'Управляет доступностью окон Defender для пользователя.', mechanism: 'UILockdown включает режим без пользовательского интерфейса.', effect: 'При скрытии фоновые компоненты продолжают работать, но окно Defender недоступно.', tradeoffs: 'Пользователь не сможет просматривать состояние и запускать действия через интерфейс.', recommendation: 'Не скрывайте интерфейс на обычном персональном ПК.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\UX Configuration\UILockdown: 0 — интерфейс доступен, 1 — скрыт.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  disabled: {title: Интерфейс скрыт, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\UX Configuration', value_name: UILockdown, view: registry64, value: 1}]}
  enabled: {title: Интерфейс доступен, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\UX Configuration', value_name: UILockdown, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\UX Configuration', value_name: UILockdown, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
