summary: Разрешает Defender ограничивать процессорную нагрузку во время проверки простоя.
explanation: {purpose: 'Управляет ограничением CPU для проверок во время простоя.', mechanism: 'DisableCpuThrottleOnIdleScans инвертированно включает или отключает ограничение.', effect: 'При включении Defender соблюдает настроенный предел процессорной нагрузки.', tradeoffs: 'Отключение ограничения ускоряет проверку, но сильнее нагружает компьютер.', recommendation: 'Оставьте ограничение включённым для обычной работы.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\Scan\DisableCpuThrottleOnIdleScans.'}
