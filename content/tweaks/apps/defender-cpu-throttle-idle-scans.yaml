  enabled: {title: Ограничение включено, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows Defender\Scan', value_name: DisableCpuThrottleOnIdleScans, view: registry64, value: 0}]}
