id: apps.edge-copilot-page-context
title: 'Контекст страницы для Copilot в Edge'
category: apps
subcategory: edge-ai
kind: setting
summary: 'Управляет передачей содержимого открытой страницы в Copilot внутри Edge.'
explanation:
  purpose: 'Позволяет отдельно запретить Copilot использовать контекст просматриваемой страницы.'
  mechanism: 'Политика CopilotPageContext задаёт доступ Copilot к содержимому страницы.'
  effect: 'При отключении ответы Copilot не используют текст и контекст текущей страницы.'
  tradeoffs: 'Контекстные ответы и действия по содержимому страницы станут менее функциональными.'
  recommendation: 'Отключайте, если анализ открытых страниц Copilot не используется.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\CopilotPageContext: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: CopilotPageContext
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: CopilotPageContext
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: CopilotPageContext
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
