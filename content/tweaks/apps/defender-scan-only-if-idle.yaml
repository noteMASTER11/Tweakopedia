explanation: {purpose: 'Уменьшает влияние плановых проверок на активную работу.', mechanism: 'ScanOnlyIfIdle разрешает запуск плановой проверки только при простое.', effect: 'Defender откладывает плановую проверку до периода бездействия.', tradeoffs: 'На постоянно используемом компьютере проверка может долго не запускаться.', recommendation: 'Включайте, если расписание регулярно совпадает с активной работой.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\Scan\ScanOnlyIfIdle.'}
