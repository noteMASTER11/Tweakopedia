id: apps.defender-network-scanning
title: 'Проверка сетевых файлов Defender'
category: apps
subcategory: defender
kind: setting
summary: 'Управляет проверкой сетевых файлов при запланированном и ручном сканировании.'
explanation:
  purpose: 'Управляет проверкой сетевых файлов при запланированном и ручном сканировании.'
  mechanism: 'DisableScanningNetworkFiles задаёт, включать ли файлы из сетевых расположений в сканирование.'
  effect: 'При включении сетевые файлы проверяются в ходе ручных и запланированных заданий; мониторинг при открытии регулируется отдельно.'
  tradeoffs: 'Проверка больших сетевых каталогов создаёт дополнительный трафик и нагрузку на файловый сервер.'
  recommendation: 'Включайте для небольших общих папок; крупные хранилища лучше проверять на стороне сервера.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows Defender\Scan\DisableScanningNetworkFiles.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 14393
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender\Scan'
        value_name: DisableScanningNetworkFiles
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows Defender\Scan'
        value_name: DisableScanningNetworkFiles
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [14393, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows Defender\Scan'
  value_name: DisableScanningNetworkFiles
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
