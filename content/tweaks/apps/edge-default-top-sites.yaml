id: apps.edge-default-top-sites
title: 'Стандартные популярные сайты Edge'
category: apps
subcategory: edge-ui
kind: setting
summary: 'Показывает или скрывает стандартный набор популярных сайтов на новой вкладке.'
explanation:
  purpose: 'Показывает или скрывает стандартный набор популярных сайтов на новой вкладке.'
  mechanism: 'Windows или приложение читает DWORD NewTabPageHideDefaultTopSites и применяет соответствующий режим.'
  effect: 'При отключении встроенные плитки популярных сайтов скрываются; пользовательские быстрые ссылки не удаляются.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте, если стандартные плитки не нужны.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\NewTabPageHideDefaultTopSites: 1 — скрыто, 0 — показано.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
  required_components: [edge]
states:
  disabled:
    title: 'Скрыто'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: NewTabPageHideDefaultTopSites
        view: registry64
        value: 1
  enabled:
    title: 'Показано'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: NewTabPageHideDefaultTopSites
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: NewTabPageHideDefaultTopSites
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
