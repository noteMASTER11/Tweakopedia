id: apps.edge-smartscreen-override
title: Обход предупреждений SmartScreen о сайтах в Edge
category: apps
subcategory: edge-ui
kind: setting
summary: Разрешает или запрещает пользователю продолжить открытие сайта после предупреждения.
explanation: {purpose: 'Управляет возможностью обойти предупреждение SmartScreen о сайте.', mechanism: 'PreventSmartScreenPromptOverride запрещает кнопку продолжения.', effect: 'При запрете предупреждение становится обязательным.', tradeoffs: 'Ошибочно заблокированный сайт нельзя открыть штатной кнопкой.', recommendation: 'Для персонального ПК обычно оставляют обход разрешённым.', technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\PreventSmartScreenPromptOverride.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240, required_components: [edge]}
states:
  allowed: {title: Обход разрешён, operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Edge', value_name: PreventSmartScreenPromptOverride, view: registry64, value: 0}]}
  blocked: {title: Обход запрещён, operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Edge', value_name: PreventSmartScreenPromptOverride, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Edge', value_name: PreventSmartScreenPromptOverride, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
