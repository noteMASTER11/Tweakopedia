id: apps.paint-background-removal
title: 'Удаление фона в Paint'
category: apps
subcategory: ai
kind: setting
summary: 'Управляет автоматическим удалением фона изображения в Paint.'
explanation:
  purpose: 'Позволяет отдельно скрыть инструмент удаления фона.'
  mechanism: 'Политика DisableRemoveBackground задаёт доступность автоматического отделения объекта от фона.'
  effect: 'При отключении команда удаления фона исчезает или перестаёт выполняться.'
  tradeoffs: 'Фон придётся удалять вручную или в другом редакторе.'
  recommendation: 'Оставляйте включённым, если используете Paint для быстрой подготовки изображений.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint\DisableRemoveBackground: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22621
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
        value_name: DisableRemoveBackground
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
        value_name: DisableRemoveBackground
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22621, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
  value_name: DisableRemoveBackground
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
