id: apps.edge-local-ai-model
title: 'Локальная базовая ИИ-модель Edge'
category: apps
subcategory: edge-ai
kind: setting
summary: 'Управляет использованием локальной базовой ИИ-модели в Microsoft Edge.'
explanation:
  purpose: 'Позволяет запретить браузеру использовать локальную модель для поддерживаемых ИИ-функций.'
  mechanism: 'Политика GenAILocalFoundationalModelSettings со значением 1 запрещает локальную базовую модель.'
  effect: 'При отключении функции Edge, зависящие от локальной модели, перестают её использовать.'
  tradeoffs: 'Часть локальных ИИ-возможностей браузера может стать недоступна.'
  recommendation: 'Отключайте, если локальные ИИ-функции Edge не нужны.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\GenAILocalFoundationalModelSettings: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: GenAILocalFoundationalModelSettings
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: GenAILocalFoundationalModelSettings
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: GenAILocalFoundationalModelSettings
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
