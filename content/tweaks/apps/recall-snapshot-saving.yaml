id: apps.recall-snapshot-saving
title: 'Сохранение снимков Windows Recall'
category: apps
subcategory: ai
kind: setting
summary: 'Разрешает или запрещает сохранение снимков экрана функцией Recall.'
explanation:
  purpose: 'Отдельно управляет накоплением снимков, используемых временной шкалой Recall.'
  mechanism: 'Политика TurnOffSavingSnapshots запрещает Recall создавать новые снимки.'
  effect: 'При отключении сохранения новые снимки Recall не создаются.'
  tradeoffs: 'Временная шкала Recall не сможет пополняться новыми данными.'
  recommendation: 'Отключайте, если снимки Recall не нужны.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\TurnOffSavingSnapshots: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22621
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
        value_name: TurnOffSavingSnapshots
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
        value_name: TurnOffSavingSnapshots
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22621, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
  value_name: TurnOffSavingSnapshots
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
