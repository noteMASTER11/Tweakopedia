id: apps.paint-generative-erase
title: 'Генеративное стирание в Paint'
category: apps
subcategory: ai
kind: setting
summary: 'Управляет удалением объектов с автоматическим восстановлением фона в Paint.'
explanation:
  purpose: 'Позволяет отдельно запретить генеративное стирание, оставив обычный ластик.'
  mechanism: 'Политика DisableGenerativeErase задаёт доступность генеративного удаления объектов.'
  effect: 'При отключении Paint не сможет автоматически дорисовывать фон после удаления объекта.'
  tradeoffs: 'Обычный ластик продолжит работать, но интеллектуальная обработка станет недоступна.'
  recommendation: 'Отключайте, если функция не нужна или должна быть исключена из интерфейса.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint\DisableGenerativeErase: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22621
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
        value_name: DisableGenerativeErase
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
        value_name: DisableGenerativeErase
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22621, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Paint'
  value_name: DisableGenerativeErase
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
