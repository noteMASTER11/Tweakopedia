id: apps.edge-new-tab-content
title: 'Содержимое Microsoft на новой вкладке Edge'
category: apps
subcategory: edge-ui
kind: setting
summary: 'Разрешает или запрещает новости и другое содержимое Microsoft на новой вкладке Edge.'
explanation:
  purpose: 'Разрешает или запрещает новости и другое содержимое Microsoft на новой вкладке Edge.'
  mechanism: 'Windows или приложение читает DWORD NewTabPageContentEnabled и применяет соответствующий режим.'
  effect: 'При запрете блок содержимого скрывается, а его переключатель в настройках новой вкладки блокируется.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Запрещайте, если новая вкладка должна оставаться лаконичной.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\NewTabPageContentEnabled: 0 — запретить, 1 — разрешить.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
  required_components: [edge]
states:
  disabled:
    title: 'Запретить'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: NewTabPageContentEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Разрешить'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: NewTabPageContentEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: NewTabPageContentEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
