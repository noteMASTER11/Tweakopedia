id: apps.edge-smartscreen
title: Microsoft Defender SmartScreen в Edge
category: apps
subcategory: edge-ui
kind: setting
summary: Проверяет сайты и загрузки в Microsoft Edge по данным репутации.
explanation: {purpose: 'Управляет SmartScreen внутри Edge.', mechanism: 'SmartScreenEnabled принудительно включает или выключает проверку.', effect: 'Edge предупреждает о подозрительных сайтах и загрузках.', tradeoffs: 'Отключение убирает проверки репутации браузера.', recommendation: 'Оставьте включённым для обычного использования Edge.', technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\SmartScreenEnabled.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240, required_components: [edge]}
states:
  disabled: {title: Выключено, operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Edge', value_name: SmartScreenEnabled, view: registry64, value: 0}]}
  enabled: {title: Включено, operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Edge', value_name: SmartScreenEnabled, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Edge', value_name: SmartScreenEnabled, view: registry64, states: {0: disabled, 1: enabled}, missing_state: enabled}
