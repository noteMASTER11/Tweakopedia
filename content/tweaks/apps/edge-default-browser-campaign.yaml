id: apps.edge-default-browser-campaign
title: 'Кампания браузера и поиска по умолчанию Edge'
category: apps
subcategory: edge-ui
kind: setting
summary: 'Управляет кампанией, предлагающей Edge и Bing в качестве стандартных приложений.'
explanation:
  purpose: 'Управляет кампанией, предлагающей Edge и Bing в качестве стандартных приложений.'
  mechanism: 'Windows или приложение читает DWORD DefaultBrowserSettingsCampaignEnabled и применяет соответствующий режим.'
  effect: 'При выключении не показываются предложения одновременно назначить Edge браузером и Bing поиском по умолчанию.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте, если такие напоминания не нужны.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\DefaultBrowserSettingsCampaignEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
  required_components: [edge]
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: DefaultBrowserSettingsCampaignEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: DefaultBrowserSettingsCampaignEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: DefaultBrowserSettingsCampaignEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
