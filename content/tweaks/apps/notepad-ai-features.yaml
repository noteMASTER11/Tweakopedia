id: apps.notepad-ai-features
title: 'ИИ-функции Блокнота'
category: apps
subcategory: ai
kind: setting
summary: 'Разрешает или запрещает встроенные ИИ-функции современного Блокнота.'
explanation:
  purpose: 'Управляет доступностью функций переписывания и других ИИ-возможностей Блокнота.'
  mechanism: 'Политика DisableAIFeatures сообщает приложению, следует ли скрыть и заблокировать эти команды.'
  effect: 'После отключения Блокнот не предлагает встроенные действия, использующие ИИ-сервисы.'
  tradeoffs: 'Обычное редактирование текста сохраняется, но связанные команды приложения становятся недоступны.'
  recommendation: 'Отключайте, если эти функции не используются или не должны быть доступны пользователям компьютера.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\WindowsNotepad\DisableAIFeatures: 1 — запретить, 0 — разрешить.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22621
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\WindowsNotepad'
        value_name: DisableAIFeatures
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\WindowsNotepad'
        value_name: DisableAIFeatures
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22621, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\WindowsNotepad'
  value_name: DisableAIFeatures
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
