id: apps.edge-spotlight-recommendations
title: 'Персональные рекомендации Microsoft в Edge'
category: apps
subcategory: edge-ui
kind: setting
summary: 'Управляет персональными фонами, текстом, уведомлениями и советами Microsoft в Edge.'
explanation:
  purpose: 'Управляет персональными фонами, текстом, уведомлениями и советами Microsoft в Edge.'
  mechanism: 'Windows или приложение читает DWORD SpotlightExperiencesAndRecommendationsEnabled и применяет соответствующий режим.'
  effect: 'При выключении соответствующие персональные рекомендации и оформления не показываются.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте для более нейтрального интерфейса браузера.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\SpotlightExperiencesAndRecommendationsEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
  required_components: [edge]
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: SpotlightExperiencesAndRecommendationsEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: SpotlightExperiencesAndRecommendationsEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: SpotlightExperiencesAndRecommendationsEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
