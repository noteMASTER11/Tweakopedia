id: apps.edge-entra-copilot-context
title: 'Контекст страницы для Entra Copilot в Edge'
category: apps
subcategory: edge-ai
kind: setting
summary: 'Управляет использованием содержимого страницы корпоративным Copilot в Edge.'
explanation:
  purpose: 'Позволяет отдельно ограничить контекст страницы для сценариев Copilot, связанных с Microsoft Entra.'
  mechanism: 'Политика EdgeEntraCopilotPageContext задаёт доступ корпоративного Copilot к содержимому страницы.'
  effect: 'При отключении корпоративный Copilot не использует контекст открытой страницы.'
  tradeoffs: 'Контекстные корпоративные сценарии Copilot могут работать с меньшим объёмом данных.'
  recommendation: 'Оставляйте включённым только при использовании соответствующей интеграции.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Edge\EdgeEntraCopilotPageContext: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: EdgeEntraCopilotPageContext
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Edge'
        value_name: EdgeEntraCopilotPageContext
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Edge'
  value_name: EdgeEntraCopilotPageContext
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
