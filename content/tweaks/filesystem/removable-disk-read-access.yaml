id: filesystem.removable-disk-read-access
title: Чтение со съёмных дисков
category: filesystem
subcategory: removable
kind: setting
summary: Разрешает или запрещает чтение данных со съёмных дисков для всего компьютера.
explanation: {purpose: 'Управляет чтением устройств класса съёмных дисков.', mechanism: 'Deny_Read задаёт машинный запрет для класса устройств.', effect: 'При запрете файлы на съёмных дисках нельзя открыть или скопировать.', tradeoffs: 'Ограничение действует на весь класс, а не на выбранное устройство.', recommendation: 'Обычно оставляйте чтение разрешённым.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}\Deny_Read.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  denied: {title: Чтение запрещено, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Read, view: registry64, value: 1}]}
  allowed: {title: Чтение разрешено, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Read, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Read, view: registry64, states: {0: allowed, 1: denied}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: high
