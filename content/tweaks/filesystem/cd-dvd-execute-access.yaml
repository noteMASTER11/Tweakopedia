id: filesystem.cd-dvd-execute-access
title: Запуск программ с CD и DVD
category: filesystem
subcategory: removable
kind: setting
summary: Разрешает или запрещает запуск исполняемых файлов с оптических носителей.
explanation: {purpose: 'Управляет исполнением программ с CD и DVD.', mechanism: 'Deny_Execute задаёт машинный запрет для класса оптических приводов.', effect: 'При запрете программы с диска не запускаются.', tradeoffs: 'Установщики придётся сначала скопировать на другой носитель.', recommendation: 'Обычно оставляйте запуск разрешённым.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}\Deny_Execute.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  denied: {title: Запуск запрещён, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Execute, view: registry64, value: 1}]}
  allowed: {title: Запуск разрешён, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Execute, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Execute, view: registry64, states: {0: allowed, 1: denied}, missing_state: allowed}
dependencies: []
conflicts: []
