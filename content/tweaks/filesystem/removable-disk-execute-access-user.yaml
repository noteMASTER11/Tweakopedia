id: filesystem.removable-disk-execute-access-user
title: Запуск программ со съёмных дисков для текущего пользователя
category: filesystem
subcategory: removable
kind: setting
summary: Разрешает или запрещает текущему пользователю запускать программы со съёмных дисков.
explanation: {purpose: 'Задаёт пользовательское правило исполнения со съёмных дисков.', mechanism: 'Deny_Execute в HKCU действует на текущую учётную запись.', effect: 'При запрете пользователь не сможет запускать приложения с носителя.', tradeoffs: 'Машинный запрет имеет приоритет, а другие пользователи не затрагиваются.', recommendation: 'Используйте для раздельной настройки учётных записей.', technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}\Deny_Execute.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  denied: {title: Запуск запрещён, operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Execute, view: registry64, value: 1}]}
  allowed: {title: Запуск разрешён, operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Execute, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f5630d-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Execute, view: registry64, states: {0: allowed, 1: denied}, missing_state: allowed}
