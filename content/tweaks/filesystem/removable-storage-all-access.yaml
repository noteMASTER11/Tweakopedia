id: filesystem.removable-storage-all-access
title: Доступ ко всем классам съёмных носителей
category: filesystem
subcategory: removable
kind: setting
summary: Одним правилом разрешает или запрещает любой доступ ко всем съёмным носителям.
explanation: {purpose: 'Задаёт общий запрет для всех классов съёмных хранилищ.', mechanism: 'Deny_All имеет приоритет над отдельными правилами чтения, записи и запуска.', effect: 'При запрете Windows блокирует доступ ко всем съёмным носителям.', tradeoffs: 'Недоступными могут стать USB-диски, оптические носители и другие классы.', recommendation: 'Не включайте общий запрет на обычном персональном ПК.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\RemovableStorageDevices\Deny_All.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  denied: {title: Доступ запрещён, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices', value_name: Deny_All, view: registry64, value: 1}]}
  allowed: {title: Доступ разрешён, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices', value_name: Deny_All, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices', value_name: Deny_All, view: registry64, states: {0: allowed, 1: denied}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
