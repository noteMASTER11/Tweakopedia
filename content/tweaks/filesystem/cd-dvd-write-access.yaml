explanation: {purpose: 'Управляет записью устройств класса CD/DVD.', mechanism: 'Deny_Write задаёт машинный запрет для оптических приводов.', effect: 'При запрете приложения не смогут записывать данные на поддерживаемые диски.', tradeoffs: 'Ограничение касается всех программ и приводов.', recommendation: 'Запрещайте, если запись оптических дисков не должна использоваться.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}\Deny_Write.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  denied: {title: Запись запрещена, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Write, view: registry64, value: 1}]}
  allowed: {title: Запись разрешена, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Write, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\RemovableStorageDevices\{53f56308-b6bf-11d0-94f2-00a0c91efb8b}', value_name: Deny_Write, view: registry64, states: {0: allowed, 1: denied}, missing_state: allowed}
