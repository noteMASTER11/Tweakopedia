id: network.rdp-avc444-mode
title: 'Режим AVC 4:4:4 в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Предпочитает режим AVC 4:4:4 для высокого качества текста и графики в удалённых сеансах.'
explanation:
  purpose: 'Управляет приоритетом полноцветного режима AVC 4:4:4 в Remote Desktop Services.'
  mechanism: 'Windows читает DWORD AVC444ModePreferred и применяет выбранный режим.'
  effect: 'При включении сервер предпочитает AVC 4:4:4 при совместимом клиенте и кодировщике.'
  tradeoffs: 'Повышенное качество может требовать большей пропускной способности и ресурсов кодирования.'
  recommendation: 'Включайте для работы с текстом и интерфейсами при достаточной пропускной способности.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services\AVC444ModePreferred: 0 — не предпочитать, 1 — предпочитать.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Не предпочитать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
        value_name: 'AVC444ModePreferred'
        view: registry64
        value: 0
  enabled:
    title: 'Предпочитать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
        value_name: 'AVC444ModePreferred'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
  value_name: 'AVC444ModePreferred'
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: reboot
impact: low
reversibility: reversible
requires_network: false
