id: network.rdp-unsigned-files-device
title: 'Неподписанные RDP-файлы на компьютере'
category: network
subcategory: remote
kind: setting
summary: 'Задаёт общее правило открытия RDP-файлов без цифровой подписи.'
explanation: {purpose: 'Устанавливает единое правило для неподписанных файлов подключения.', mechanism: 'Системная политика AllowUnsignedFiles управляет их открытием клиентом RDP.', effect: 'При блокировке неподписанные файлы подключения не запускаются.', tradeoffs: 'Локально созданные профили подключения могут потребовать другой способ настройки.', recommendation: 'Блокируйте в управляемой среде с подписанными профилями.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\AllowUnsignedFiles: 0 — блокировать, 1 — разрешать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  blocked: {title: 'Блокировать', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowUnsignedFiles, view: registry64, value: 0}]}
  allowed: {title: 'Разрешать', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowUnsignedFiles, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowUnsignedFiles, view: registry64, states: {0: blocked, 1: allowed}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
