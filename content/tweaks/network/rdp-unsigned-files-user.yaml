id: network.rdp-unsigned-files-user
title: 'Неподписанные RDP-файлы для текущего пользователя'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает текущему пользователю открывать RDP-файлы без цифровой подписи издателя.'
explanation: {purpose: 'Управляет запуском неподписанных файлов подключения RDP.', mechanism: 'Пользовательская политика AllowUnsignedFiles разрешает или блокирует такие файлы.', effect: 'При запрете клиент отклоняет неподписанные RDP-файлы.', tradeoffs: 'Самостоятельно созданные файлы подключения потребуется подписать или настроить вручную.', recommendation: 'Блокируйте, если подключения распространяются централизованно и подписываются.', technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows NT\Terminal Services\AllowUnsignedFiles: 0 — блокировать, 1 — разрешать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  blocked: {title: 'Блокировать', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowUnsignedFiles, view: registry64, value: 0}]}
  allowed: {title: 'Разрешать', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowUnsignedFiles, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowUnsignedFiles, view: registry64, states: {0: blocked, 1: allowed}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
