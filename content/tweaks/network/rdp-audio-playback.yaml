id: network.rdp-audio-playback
title: 'Воспроизведение звука в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает передавать звук удалённого компьютера на устройство клиента.'
explanation: {purpose: 'Управляет выводом звука из удалённого сеанса.', mechanism: 'Параметр fDisableCam разрешает или блокирует перенаправление воспроизведения звука.', effect: 'При запрете звук удалённых приложений не передаётся клиенту.', tradeoffs: 'Запрет уменьшает сетевой поток, но лишает сеанс звука.', recommendation: 'Оставляйте разрешённым, если в удалённых приложениях нужен звук.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableCam: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCam, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCam, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCam, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
