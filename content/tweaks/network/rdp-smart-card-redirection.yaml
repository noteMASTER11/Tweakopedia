id: network.rdp-smart-card-redirection
title: 'Смарт-карты в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает удалённому сеансу использовать смарт-карты клиентского устройства.'
explanation: {purpose: 'Передаёт считыватели и смарт-карты клиента в удалённую систему.', mechanism: 'Параметр fEnableSmartCard определяет доступность перенаправления смарт-карт.', effect: 'При запрете вход и подпись со смарт-картой клиента внутри сеанса не работают.', tradeoffs: 'Могут перестать работать корпоративные сценарии проверки подлинности.', recommendation: 'Оставляйте разрешённым при использовании смарт-карт; иначе можно запретить.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fEnableSmartCard: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fEnableSmartCard, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fEnableSmartCard, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fEnableSmartCard, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
