id: network.rdp-password-saving-user
title: 'Сохранение пароля RDP для текущего пользователя'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает клиенту удалённого рабочего стола сохранять пароль в профиле текущего пользователя.'
explanation: {purpose: 'Управляет сохранением паролей для подключений RDP.', mechanism: 'Политика DisablePasswordSaving задаёт, может ли клиент предложить сохранить введённые учётные данные.', effect: 'При запрете пароль придётся вводить при каждом новом подключении.', tradeoffs: 'Запрет уменьшает удобство частых подключений.', recommendation: 'Запрещайте на общих компьютерах; на личном устройстве выбирайте по своему сценарию.', technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows NT\Terminal Services\DisablePasswordSaving: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: DisablePasswordSaving, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: DisablePasswordSaving, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: DisablePasswordSaving, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
