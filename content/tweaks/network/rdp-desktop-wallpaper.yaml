id: network.rdp-desktop-wallpaper
title: 'Фоновое изображение в сеансе RDP'
category: network
subcategory: remote
kind: setting
summary: 'Показывает или скрывает фоновое изображение рабочего стола в удалённом сеансе.'
explanation: {purpose: 'Позволяет уменьшить объём графических обновлений в RDP-сеансе.', mechanism: 'Параметр fNoRemoteDesktopWallpaper запрещает передачу фонового изображения рабочего стола.', effect: 'При скрытии фон заменяется однотонным оформлением.', tradeoffs: 'Интерфейс выглядит проще, зато на медленном канале передаётся меньше данных.', recommendation: 'Скрывайте фон при медленном или нестабильном подключении.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fNoRemoteDesktopWallpaper: 0 — показывать, 1 — скрывать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
