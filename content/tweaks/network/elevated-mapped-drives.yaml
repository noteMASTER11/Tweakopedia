id: network.elevated-mapped-drives
title: Сетевые диски в повышенных приложениях
category: network
subcategory: mapped-drives
kind: setting
summary: Делает подключённые пользователем сетевые диски видимыми программам, запущенным с повышенными правами.
explanation:
  purpose: Устраняет ситуацию, когда обычное приложение видит подключённый диск, а запущенное с повышением — нет.
  mechanism: EnableLinkedConnections связывает сетевые подключения обычного и повышенного маркеров одного пользователя.
  effect: Повышенные файловые менеджеры, консоли и установщики получают доступ к тем же буквам сетевых дисков.
  tradeoffs: Граница между обычным и повышенным сеансом для сетевых подключений становится менее изолированной.
  recommendation: Включайте, если повышенным программам действительно нужны уже подключённые сетевые диски.
  technical_details: Изменяется 32-битный DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLinkedConnections. Значение 1 включает связывание подключений.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: Выключено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableLinkedConnections
        view: registry64
        value: 0
  enabled:
    title: Включено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableLinkedConnections
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: EnableLinkedConnections
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
