id: network.rdp-end-session-on-limit-device
title: 'Завершение RDP-сеанса по лимиту на компьютере'
category: network
subcategory: remote
kind: setting
summary: 'Задаёт общее поведение RDP-сеансов после достижения лимита времени.'
explanation: {purpose: 'Применяет единое правило к сеансам на компьютере.', mechanism: 'Системная политика fResetBroken выбирает завершение сеанса либо отключение клиента.', effect: 'При завершении приложения закрываются; при отключении состояние сеанса сохраняется.', tradeoffs: 'Завершение освобождает ресурсы, но может привести к потере несохранённой работы.', recommendation: 'Оставляйте отключение для рабочих станций; завершение используйте при строгом управлении сеансами.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fResetBroken: 0 — отключить, 1 — завершить.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  disconnect: {title: 'Отключить сеанс', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fResetBroken, view: registry64, value: 0}]}
  end: {title: 'Завершить сеанс', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fResetBroken, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: disconnect}, {os: windows11, builds: [22000, 26200], state: disconnect}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fResetBroken, view: registry64, states: {0: disconnect, 1: end}, missing_state: disconnect}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
