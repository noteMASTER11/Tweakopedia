id: network.sharing-wizard
title: 'Мастер общего доступа'
category: network
subcategory: sharing
kind: setting
summary: 'Управляет упрощённым мастером публикации папок в сети.'
explanation:
  purpose: 'Управляет упрощённым мастером публикации папок в сети.'
  mechanism: 'Параметр SharingWizardOn задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении команды общего доступа используют более прямой интерфейс разрешений.'
  tradeoffs: 'Настройка сетевой папки становится менее понятной для неподготовленного пользователя.'
  recommendation: 'Оставляйте включённым для обычного использования.'
  technical_details: 'Основной объект — 32-битный DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\SharingWizardOn.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: SharingWizardOn
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: SharingWizardOn
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: SharingWizardOn
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
