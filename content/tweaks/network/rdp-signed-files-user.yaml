id: network.rdp-signed-files-user
title: 'Подписанные RDP-файлы для текущего пользователя'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает текущему пользователю открывать RDP-файлы с действительной подписью.'
explanation: {purpose: 'Управляет запуском подписанных файлов подключения RDP.', mechanism: 'Пользовательская политика AllowSignedFiles разрешает или блокирует файлы с цифровой подписью.', effect: 'При запрете даже подписанные профили подключения не открываются.', tradeoffs: 'Подключения придётся задавать вручную или запускать другим способом.', recommendation: 'Оставляйте разрешённым, если RDP-клиент используется.', technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows NT\Terminal Services\AllowSignedFiles: 0 — блокировать, 1 — разрешать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  blocked: {title: 'Блокировать', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowSignedFiles, view: registry64, value: 0}]}
  allowed: {title: 'Разрешать', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowSignedFiles, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKCU, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowSignedFiles, view: registry64, states: {0: blocked, 1: allowed}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
