id: network.winrm-remote-shell
title: 'Удалённая оболочка WinRM'
category: network
subcategory: remote
kind: setting
summary: 'Управляет созданием удалённых командных сеансов через WinRM.'
explanation:
  purpose: 'Управляет созданием удалённых командных сеансов через WinRM.'
  mechanism: 'Параметр AllowRemoteShellAccess задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении PowerShell Remoting и WinRS не смогут создавать удалённую оболочку.'
  tradeoffs: 'Средства администрирования, зависящие от WinRM, потеряют доступ.'
  recommendation: 'Отключайте только если удалённое управление через WinRM не используется.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS\AllowRemoteShellAccess.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
        value_name: AllowRemoteShellAccess
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
        value_name: AllowRemoteShellAccess
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
  value_name: AllowRemoteShellAccess
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: service
impact: high
reversibility: reversible
requires_network: false
