id: network.rdp-always-prompt-password
title: 'Запрос пароля сервером RDP'
category: network
subcategory: remote
kind: setting
summary: 'Требует от сервера RDP запрашивать пароль при каждом подключении.'
explanation: {purpose: 'Не позволяет серверу RDP пропускать запрос пароля за счёт ранее переданных данных.', mechanism: 'Политика fPromptForPassword заставляет узел сеансов запрашивать пароль у подключающегося пользователя.', effect: 'При включении каждый сеанс требует отдельного ввода пароля.', tradeoffs: 'Автоматическое подключение становится менее удобным.', recommendation: 'Включайте, если обязательный повторный ввод важнее скорости подключения.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fPromptForPassword: 0 — обычное поведение, 1 — всегда запрашивать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  disabled: {title: 'Обычный запрос', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fPromptForPassword, view: registry64, value: 0}]}
  enabled: {title: 'Всегда запрашивать', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fPromptForPassword, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: disabled}, {os: windows11, builds: [22000, 26200], state: disabled}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fPromptForPassword, view: registry64, states: {0: disabled, 1: enabled}, missing_state: disabled}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
