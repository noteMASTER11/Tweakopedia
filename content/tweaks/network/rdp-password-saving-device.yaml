id: network.rdp-password-saving-device
title: 'Сохранение паролей RDP на компьютере'
category: network
subcategory: remote
kind: setting
summary: 'Задаёт общее правило сохранения паролей клиентом удалённого рабочего стола.'
explanation: {purpose: 'Устанавливает единое правило сохранения паролей RDP для компьютера.', mechanism: 'Системная политика DisablePasswordSaving управляет предложением сохранить учётные данные.', effect: 'При запрете пароль не сохраняется клиентом RDP.', tradeoffs: 'Пользователям придётся чаще вводить пароль вручную.', recommendation: 'Запрещайте на компьютерах с несколькими пользователями.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\DisablePasswordSaving: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: DisablePasswordSaving, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: DisablePasswordSaving, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: DisablePasswordSaving, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
