id: network.rdp-pnp-redirection
title: 'Поддерживаемые Plug and Play устройства в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает перенаправлять поддерживаемые Plug and Play устройства клиента в удалённый сеанс.'
explanation: {purpose: 'Делает совместимые локальные устройства доступными удалённым приложениям.', mechanism: 'Параметр fDisablePNPRedir управляет перенаправлением Plug and Play устройств.', effect: 'При запрете устройства клиента не подключаются к удалённому сеансу.', tradeoffs: 'Специализированные USB- и PnP-устройства могут стать недоступны.', recommendation: 'Разрешайте только при необходимости работы с такими устройствами.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisablePNPRedir: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisablePNPRedir, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisablePNPRedir, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisablePNPRedir, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
