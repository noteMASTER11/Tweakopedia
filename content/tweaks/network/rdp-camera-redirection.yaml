id: network.rdp-camera-redirection
title: 'Камера в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает удалённым приложениям использовать камеру клиентского устройства.'
explanation: {purpose: 'Передаёт совместимые камеры клиента в удалённый сеанс.', mechanism: 'Параметр fDisableCameraRedir разрешает или блокирует перенаправление видеоустройств.', effect: 'При запрете камера клиента не появляется в удалённых приложениях.', tradeoffs: 'Видеозвонки и захват изображения внутри сеанса могут стать недоступны.', recommendation: 'Разрешайте только для приложений, которым действительно нужна камера.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableCameraRedir: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 17134}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCameraRedir, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCameraRedir, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [17134, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCameraRedir, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
