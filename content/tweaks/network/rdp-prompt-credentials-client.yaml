id: network.rdp-prompt-credentials-client
title: 'Запрос учётных данных клиентом RDP'
category: network
subcategory: remote
kind: setting
summary: 'Переносит запрос учётных данных с удалённого компьютера в локальный клиент RDP.'
explanation: {purpose: 'Определяет, где пользователь вводит данные для подключения.', mechanism: 'Параметр PromptForCredsOnClient заставляет клиент запросить данные до установления сеанса.', effect: 'Окно ввода появляется локально, а не на удалённом узле.', tradeoffs: 'Поведение входа отличается от стандартного сценария некоторых серверов.', recommendation: 'Используйте локальный запрос, если нужен единообразный ввод до подключения.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\PromptForCredsOnClient: 0 — стандартный запрос, 1 — запрос на клиенте.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  default: {title: 'Стандартный запрос', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: PromptForCredsOnClient, view: registry64, value: 0}]}
  client: {title: 'Запрашивать на клиенте', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: PromptForCredsOnClient, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: default}, {os: windows11, builds: [22000, 26200], state: default}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: PromptForCredsOnClient, view: registry64, states: {0: default, 1: client}, missing_state: default}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
