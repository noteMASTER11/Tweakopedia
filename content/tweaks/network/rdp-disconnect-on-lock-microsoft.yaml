  disconnect: {title: 'Отключить сеанс', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisconnectOnLockMicrosoftIdentity, view: registry64, value: 1}]}
windows_defaults: [{os: windows11, builds: [22621, 26200], state: disconnect}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisconnectOnLockMicrosoftIdentity, view: registry64, states: {0: lock_screen, 1: disconnect}, missing_state: disconnect}
