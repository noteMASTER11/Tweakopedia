id: network.rdp-clipboard-redirection
title: 'Буфер обмена в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает копировать текст и другие поддерживаемые данные между клиентом и удалённым сеансом.'
explanation: {purpose: 'Управляет общим буфером обмена между локальной и удалённой системой.', mechanism: 'Инвертированный параметр fDisableClip включает или блокирует перенаправление буфера обмена.', effect: 'При запрете копирование через границу RDP-сеанса не работает.', tradeoffs: 'Перенос данных придётся выполнять другими способами.', recommendation: 'Запрещайте в изолированных удалённых средах; в личных сеансах обычно удобно оставить.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableClip: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableClip, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableClip, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableClip, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
