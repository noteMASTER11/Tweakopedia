id: network.domain-name-devolution
title: 'Сокращение доменного имени при поиске'
category: network
subcategory: discovery
kind: setting
summary: 'Управляет последовательным сокращением DNS-суффикса при разрешении коротких имён.'
explanation:
  purpose: 'Управляет последовательным сокращением DNS-суффикса при разрешении коротких имён.'
  mechanism: 'Параметр UseDomainNameDevolution задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении поиск коротких имён ограничивается явно заданными суффиксами.'
  tradeoffs: 'Некоторые имена во вложенной доменной структуре могут перестать разрешаться.'
  recommendation: 'Оставляйте включённым в сети, которая зависит от этого механизма.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\UseDomainNameDevolution.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
        value_name: UseDomainNameDevolution
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
        value_name: UseDomainNameDevolution
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
  value_name: UseDomainNameDevolution
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: medium
reversibility: reversible
requires_network: false
