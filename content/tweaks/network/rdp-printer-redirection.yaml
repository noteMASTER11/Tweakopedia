id: network.rdp-printer-redirection
title: 'Принтеры клиента в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает печатать из удалённого сеанса на принтерах клиентского компьютера.'
explanation: {purpose: 'Делает локальные принтеры доступными удалённым приложениям.', mechanism: 'Параметр fDisableCpm управляет перенаправлением клиентских принтеров.', effect: 'При запрете принтеры клиента не создаются в удалённом сеансе.', tradeoffs: 'Печать придётся выполнять через принтеры удалённого компьютера или передачу файла.', recommendation: 'Разрешайте, если печать на локальном устройстве входит в рабочий сценарий.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableCpm: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCpm, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCpm, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCpm, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
