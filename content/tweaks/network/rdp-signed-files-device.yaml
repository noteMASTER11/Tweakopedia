id: network.rdp-signed-files-device
title: 'Подписанные RDP-файлы на компьютере'
category: network
subcategory: remote
kind: setting
summary: 'Задаёт общее правило открытия RDP-файлов с действительной подписью.'
explanation: {purpose: 'Устанавливает единое правило запуска подписанных профилей RDP.', mechanism: 'Системная политика AllowSignedFiles управляет открытием файлов с цифровой подписью.', effect: 'При блокировке подписанные файлы подключения не запускаются.', tradeoffs: 'Пользователи теряют обычный способ запуска подготовленных подключений.', recommendation: 'Оставляйте разрешённым при использовании RDP.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\AllowSignedFiles: 0 — блокировать, 1 — разрешать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  blocked: {title: 'Блокировать', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowSignedFiles, view: registry64, value: 0}]}
  allowed: {title: 'Разрешать', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowSignedFiles, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: AllowSignedFiles, view: registry64, states: {0: blocked, 1: allowed}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
