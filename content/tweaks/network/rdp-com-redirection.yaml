id: network.rdp-com-redirection
title: 'COM-порты в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает удалённому сеансу использовать последовательные порты клиентского компьютера.'
explanation: {purpose: 'Передаёт локальные COM-порты в удалённую систему.', mechanism: 'Параметр fDisableCcm включает или блокирует перенаправление последовательных портов.', effect: 'При запрете устройства на COM-портах клиента не видны в сеансе.', tradeoffs: 'Старое оборудование и специализированные программы могут потерять связь с устройством.', recommendation: 'Разрешайте только при наличии нужного COM-устройства.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableCcm: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCcm, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCcm, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCcm, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
