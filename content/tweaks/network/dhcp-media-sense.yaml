id: network.dhcp-media-sense
title: 'Определение состояния подключения DHCP'
category: network
subcategory: discovery
kind: setting
summary: 'Управляет реакцией TCP/IP и DHCP на физическое отключение интерфейса.'
explanation:
  purpose: 'Управляет реакцией TCP/IP и DHCP на физическое отключение интерфейса.'
  mechanism: 'Параметр DisableDHCPMediaSense задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении функции Windows может дольше сохранять сетевую конфигурацию после потери подключения.'
  tradeoffs: 'Изменение способно влиять на переключение сетей и повторное получение адреса.'
  recommendation: 'Оставляйте функцию включённой без конкретной причины для изменения.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\DisableDHCPMediaSense.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
        value_name: DisableDHCPMediaSense
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
        value_name: DisableDHCPMediaSense
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
  value_name: DisableDHCPMediaSense
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: medium
reversibility: reversible
requires_network: false
