id: network.netbios-name-resolution
title: 'Устаревшее разрешение имён NetBIOS'
category: network
subcategory: discovery
kind: setting
summary: 'Управляет использованием NetBIOS как устаревшего механизма разрешения имён.'
explanation:
  purpose: 'Управляет использованием NetBIOS как устаревшего механизма разрешения имён.'
  mechanism: 'Параметр EnableNetbios задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении старые устройства и программы, зависящие от NetBIOS-имён, могут перестать обнаруживаться.'
  tradeoffs: 'Совместимость со старыми локальными сетями снижается.'
  recommendation: 'Отключайте только после проверки локальных общих ресурсов и старых устройств.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters\EnableNetbios.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
        value_name: EnableNetbios
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
        value_name: EnableNetbios
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
  value_name: EnableNetbios
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: service
impact: medium
reversibility: reversible
requires_network: false
