id: network.rdp-webauthn-redirection
title: 'WebAuthn в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает удалённому сеансу использовать совместимые средства входа WebAuthn на клиенте.'
explanation: {purpose: 'Передаёт запросы WebAuthn к поддерживаемым устройствам и Windows Hello клиента.', mechanism: 'Параметр fDisableWebAuthn включает или блокирует перенаправление WebAuthn.', effect: 'При запрете удалённые приложения не смогут обращаться к этим средствам входа клиента.', tradeoffs: 'Может потребоваться другой способ подтверждения учётной записи.', recommendation: 'Разрешайте, если удалённые приложения используют WebAuthn или Windows Hello.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableWebAuthn: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 19041}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableWebAuthn, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableWebAuthn, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [19041, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableWebAuthn, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
