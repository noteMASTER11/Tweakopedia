id: network.rdp-audio-capture
title: 'Запись звука в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает удалённому сеансу использовать микрофон клиентского устройства.'
explanation: {purpose: 'Управляет передачей входного аудиосигнала в удалённый сеанс.', mechanism: 'Политика fDisableAudioCapture разрешает или блокирует перенаправление записи звука.', effect: 'При запрете удалённые приложения не увидят микрофон клиента.', tradeoffs: 'Станут недоступны звонки и запись речи внутри сеанса.', recommendation: 'Разрешайте только тогда, когда микрофон действительно нужен в RDP.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableAudioCapture: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableAudioCapture, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableAudioCapture, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableAudioCapture, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
