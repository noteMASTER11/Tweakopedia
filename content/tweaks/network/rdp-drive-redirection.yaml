id: network.rdp-drive-redirection
title: 'Накопители клиента в RDP'
category: network
subcategory: remote
kind: setting
summary: 'Разрешает удалённому сеансу видеть выбранные диски клиентского компьютера.'
explanation: {purpose: 'Обеспечивает доступ к локальным файлам из удалённого сеанса.', mechanism: 'Параметр fDisableCdm разрешает или блокирует перенаправление дисков клиента.', effect: 'При запрете локальные диски не появляются в Проводнике удалённой системы.', tradeoffs: 'Обмен файлами через перенаправленные диски станет недоступен.', recommendation: 'Разрешайте для удобного обмена файлами; блокируйте в изолированных средах.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows NT\Terminal Services\fDisableCdm: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCdm, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCdm, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows NT\Terminal Services', value_name: fDisableCdm, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
