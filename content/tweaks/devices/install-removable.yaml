id: devices.install-removable
title: Установка съёмных устройств
category: devices
subcategory: installation
kind: setting
summary: Разрешает или запрещает установку устройств, которые Windows считает съёмными.
explanation: {purpose: 'Ограничивает установку всего класса съёмных устройств.', mechanism: 'DenyRemovableDevices включает запрет установки и обновления драйверов.', effect: 'Новые съёмные устройства не устанавливаются, если запрет включён.', tradeoffs: 'Под запрет могут попасть USB-накопители, телефоны и периферия.', recommendation: 'На персональном ПК обычно оставляют установку разрешённой.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\DeviceInstall\Restrictions\DenyRemovableDevices.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  disabled: {title: Установка запрещена, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\DeviceInstall\Restrictions', value_name: DenyRemovableDevices, view: registry64, value: 1}]}
  enabled: {title: Установка разрешена, operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\DeviceInstall\Restrictions', value_name: DenyRemovableDevices, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\DeviceInstall\Restrictions', value_name: DenyRemovableDevices, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
dependencies: []
conflicts: []
restart: none
impact: high
reversibility: reversible
requires_network: false
