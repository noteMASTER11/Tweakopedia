id: devices.oem-logo
title: 'Логотип производителя'
category: devices
subcategory: metadata
kind: setting
summary: 'Устанавливает BMP-логотип и связывает его с OEM-сведениями Windows.'
explanation:
  purpose: 'Позволяет установить или удалить логотип, отображаемый рядом со сведениями производителя.'
  mechanism: 'Выбранный BMP копируется в System32, а путь записывается в строку Logo раздела OEMInformation.'
  effect: 'Системные окна, поддерживающие OEM-оформление, могут показывать выбранный логотип.'
  tradeoffs: 'Поддерживается только BMP размером не более 1 МБ; исходный файл назначения сохраняется в транзакции.'
  recommendation: 'Используйте компактное квадратное изображение BMP с читаемым контрастом.'
  technical_details: 'Файл заменяется по фиксированному пути C:\Windows\System32\oemlogo.bmp; REG_SZ Logo получает тот же путь.'
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
inputs:
  logo:
    type: file
    label: 'Логотип BMP'
    required: true
    extensions: [bmp]
    max_size: 1048576
states:
  cleared:
    title: 'Удалить логотип'
    operations:
      - {type: file.delete, destination: 'C:/Windows/System32/oemlogo.bmp'}
      - {type: registry.delete_value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: Logo, view: registry64}
  configured:
    title: 'Установить логотип'
    operations:
      - {type: file.replace, input: logo, destination: 'C:/Windows/System32/oemlogo.bmp'}
      - {type: registry.set_value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: Logo, view: registry64, value_type: string, value: 'C:\Windows\System32\oemlogo.bmp'}
windows_defaults:
  - {os: windows10, builds: [10240, 19045], state: cleared}
  - {os: windows11, builds: [22000, 26200], state: cleared}
detect:
  type: registry.value
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation'
  value_name: Logo
  view: registry64
  states:
    configured: {value_type: string, value: 'C:\Windows\System32\oemlogo.bmp'}
  missing_state: cleared
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
