id: devices.oem-model
title: 'Модель компьютера'
category: devices
subcategory: metadata
kind: setting
summary: 'Задаёт пользовательское название модели в OEM-сведениях Windows.'
explanation:
  purpose: 'Позволяет указать или убрать отображаемую модель компьютера.'
  mechanism: 'Windows читает строку Model из раздела OEMInformation системного реестра.'
  effect: 'Системные окна, использующие OEM-сведения, показывают заданную модель.'
  tradeoffs: 'Параметр не меняет данные SMBIOS и не влияет на драйверы.'
  recommendation: 'Укажите фактическую модель устройства либо оставьте значение очищенным.'
  technical_details: 'Изменяется REG_SZ HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation\Model.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
inputs:
  model:
    type: text
    label: 'Модель'
    required: true
    min_length: 1
    max_length: 128
states:
  cleared:
    title: 'Очистить'
    operations:
      - {type: registry.delete_value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: Model, view: registry64}
  configured:
    title: 'Задать значение'
    operations:
      - {type: registry.set_value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: Model, view: registry64, value_type: string, value: '${input.model}'}
windows_defaults:
  - {os: windows10, builds: [10240, 19045], state: cleared}
  - {os: windows11, builds: [22000, 26200], state: cleared}
detect: {type: registry.value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: Model, view: registry64, states: {}, missing_state: cleared}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
