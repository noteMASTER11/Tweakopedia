id: devices.oem-support-phone
title: 'Телефон поддержки OEM'
category: devices
subcategory: metadata
kind: setting
summary: 'Задаёт контактный телефон службы поддержки производителя.'
explanation:
  purpose: 'Позволяет указать или убрать телефон, отображаемый в OEM-сведениях.'
  mechanism: 'Windows читает строку SupportPhone из раздела OEMInformation.'
  effect: 'В системных сведениях о поддержке показывается заданный номер.'
  tradeoffs: 'Значение является обычным текстом; его актуальность Windows не проверяет.'
  recommendation: 'Используйте номер вместе с кодом страны либо очистите устаревший контакт.'
  technical_details: 'Изменяется REG_SZ HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation\SupportPhone.'
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
inputs:
  support_phone: {type: text, label: 'Телефон поддержки', required: true, min_length: 1, max_length: 64}
states:
  cleared:
    title: 'Очистить'
    operations:
      - {type: registry.delete_value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: SupportPhone, view: registry64}
  configured:
    title: 'Задать значение'
    operations:
      - {type: registry.set_value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: SupportPhone, view: registry64, value_type: string, value: '${input.support_phone}'}
windows_defaults:
  - {os: windows10, builds: [10240, 19045], state: cleared}
  - {os: windows11, builds: [22000, 26200], state: cleared}
detect: {type: registry.value, hive: HKLM, key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation', value_name: SupportPhone, view: registry64, states: {}, missing_state: cleared}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
