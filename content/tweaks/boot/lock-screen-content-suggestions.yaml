id: boot.lock-screen-content-suggestions
title: 'Предложения содержимого на экране блокировки'
category: boot
subcategory: lock-screen
kind: setting
summary: 'Управляет дополнительными предложениями и подсказками на экране блокировки.'
explanation:
  purpose: 'Позволяет убрать рекламные и справочные элементы, связанные с изображением экрана блокировки.'
  mechanism: 'Параметр SubscribedContent-338387Enabled задаёт показ соответствующего канала содержимого.'
  effect: 'При отключении часть предложений и подсказок на экране блокировки не отображается.'
  tradeoffs: 'Связанные сведения и рекомендации исчезнут.'
  recommendation: 'Отключайте, если нужен лаконичный экран блокировки.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\SubscribedContent-338387Enabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SubscribedContent-338387Enabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SubscribedContent-338387Enabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
  value_name: SubscribedContent-338387Enabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false
