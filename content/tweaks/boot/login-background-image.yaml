id: boot.login-background-image
title: 'Фоновое изображение экрана входа ранней Windows 10'
category: boot
subcategory: sign-in
kind: setting
summary: 'Показывает или скрывает фоновое изображение на экране входа ранних сборок Windows 10.'
explanation:
  purpose: 'Управляет изображением, которое находилось за формой ввода пароля в первой версии Windows 10.'
  mechanism: 'DisableLogonBackgroundImage заменяет изображение однотонным фоном.'
  effect: 'Экран входа показывает штатное изображение либо однотонный цвет.'
  tradeoffs: 'Параметр относится только к раннему варианту экрана входа и позднее был удалён.'
  recommendation: 'Не изменяйте на современных сборках; программа там этот пункт не показывает.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\System\DisableLogonBackgroundImage: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10]
  min_build: 10240
  max_build: 10586
states:
  disabled:
    title: 'Скрывать изображение'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\System'
        value_name: DisableLogonBackgroundImage
        view: registry64
        value: 1
  enabled:
    title: 'Показывать изображение'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\System'
        value_name: DisableLogonBackgroundImage
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 10586]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\System'
  value_name: DisableLogonBackgroundImage
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false

