id: boot.password-reveal-button
title: Кнопка показа пароля
category: boot
subcategory: sign-in
kind: setting
summary: Управляет кнопкой, временно показывающей введённый пароль в системных полях Windows.
explanation:
  purpose: Позволяет скрыть кнопку просмотра пароля либо оставить возможность проверить введённые символы.
  mechanism: Политика DisablePasswordReveal применяется к системному интерфейсу учётных данных и приложениям, использующим стандартный элемент ввода Windows.
  effect: При выключении кнопка с изображением глаза не появляется после ввода пароля.
  tradeoffs: Пользователь не сможет визуально проверить пароль перед отправкой формы; собственные поля сторонних программ могут не подчиняться политике.
  recommendation: На личном компьютере обычно оставляйте включённой; скрывайте на общедоступных рабочих местах при необходимости.
  technical_details: Изменяется 32-битный DWORD HKLM\Software\Policies\Microsoft\Windows\CredUI\DisablePasswordReveal. Значение 1 скрывает кнопку, 0 показывает.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 15063
states:
  disabled:
    title: Выключена
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\CredUI'
        value_name: DisablePasswordReveal
        view: registry64
        value: 1
  enabled:
    title: Включена
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\CredUI'
        value_name: DisablePasswordReveal
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [15063, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\CredUI'
  value_name: DisablePasswordReveal
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
