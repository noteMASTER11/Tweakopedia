id: boot.run-startup-user
title: 'Команды Run для текущего пользователя'
category: boot
subcategory: sign-in
kind: setting
summary: 'Разрешает запускать программы из пользовательского раздела Run при входе.'
explanation: {purpose: 'Управляет обычными программами автозапуска текущего пользователя.', mechanism: 'Инвертированная политика DisableCurrentUserRun разрешает или игнорирует записи раздела Run в профиле.', effect: 'При отключении соответствующие программы не запускаются при входе.', tradeoffs: 'Некоторые фоновые приложения и их значки могут не появиться.', recommendation: 'Отключайте только после проверки состава пользовательского автозапуска.', technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisableCurrentUserRun: 0 — выполнять, 1 — не выполнять.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  enabled: {title: 'Выполнять', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: DisableCurrentUserRun, view: registry64, value: 0}]}
  disabled: {title: 'Не выполнять', operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: DisableCurrentUserRun, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: DisableCurrentUserRun, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
dependencies: []
conflicts: []
restart: sign_out
impact: high
reversibility: reversible
requires_network: false
