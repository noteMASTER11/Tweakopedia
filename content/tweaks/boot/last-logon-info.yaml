id: boot.last-logon-info
title: Сведения о предыдущем входе
category: boot
subcategory: diagnostics
kind: setting
summary: Показывает дату и время предыдущего успешного и неуспешного входа после проверки учётных данных.
explanation:
  purpose: Помогает пользователю замечать неожиданные попытки входа в его учётную запись.
  mechanism: Политика DisplayLastLogonInfo добавляет информационный экран Winlogon перед открытием рабочего стола.
  effect: После входа необходимо подтвердить экран со сведениями о предыдущих попытках.
  tradeoffs: Добавляется ещё один шаг; некоторые сетевые типы учётных записей могут не предоставлять нужные сведения.
  recommendation: Используйте прежде всего с локальными и доменными учётными записями, где этот сценарий проверен.
  technical_details: Изменяется 32-битный DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\DisplayLastLogonInfo. Значение 1 включает экран сведений.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: Выключено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: DisplayLastLogonInfo
        view: registry64
        value: 0
  enabled:
    title: Включено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: DisplayLastLogonInfo
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: DisplayLastLogonInfo
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
