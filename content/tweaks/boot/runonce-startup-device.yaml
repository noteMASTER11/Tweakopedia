id: boot.runonce-startup-device
title: 'Общесистемные команды RunOnce'
category: boot
subcategory: sign-in
kind: setting
summary: 'Разрешает выполнять одноразовые общесистемные команды RunOnce при входе.'
explanation: {purpose: 'Управляет одноразовыми действиями установки и обслуживания для компьютера.', mechanism: 'Инвертированная политика DisableLocalMachineRunOnce разрешает или игнорирует машинный раздел RunOnce.', effect: 'При отключении подготовленные системные действия при входе не выполняются.', tradeoffs: 'Установка или обновление программ может остаться незавершённым.', recommendation: 'Оставляйте включённым, если состав RunOnce заранее не проверен.', technical_details: 'DWORD HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisableLocalMachineRunOnce: 0 — выполнять, 1 — не выполнять.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  enabled: {title: 'Выполнять', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: DisableLocalMachineRunOnce, view: registry64, value: 0}]}
  disabled: {title: 'Не выполнять', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: DisableLocalMachineRunOnce, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: DisableLocalMachineRunOnce, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
dependencies: []
conflicts: []
restart: sign_out
impact: high
reversibility: reversible
requires_network: false
