id: boot.lock-screen-camera
title: 'Камера на экране блокировки'
category: boot
subcategory: sign-in
kind: setting
summary: 'Управляет доступом к камере до входа в учётную запись.'
explanation:
  purpose: 'Управляет доступом к камере до входа в учётную запись.'
  mechanism: 'Параметр NoLockScreenCamera задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении камеру нельзя открыть с экрана блокировки.'
  tradeoffs: 'Быстрая съёмка до входа становится недоступна.'
  recommendation: 'Отключайте, если камера до входа не используется.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization\NoLockScreenCamera.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Personalization'
        value_name: NoLockScreenCamera
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Personalization'
        value_name: NoLockScreenCamera
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\Personalization'
  value_name: NoLockScreenCamera
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false
