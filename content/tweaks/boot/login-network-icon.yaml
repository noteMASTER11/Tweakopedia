id: boot.login-network-icon
title: Значок сети на экране входа
category: boot
subcategory: sign-in
kind: setting
summary: Управляет доступом к выбору сети с экрана блокировки и входа.
explanation:
  purpose: Позволяет убрать сетевое меню до входа пользователя либо вернуть его.
  mechanism: Политика DontDisplayNetworkSelectionUI скрывает системный элемент выбора сети на экранах входа.
  effect: При выключении нельзя переключить или отключить сеть до входа в учётную запись.
  tradeoffs: Подключиться к новой сети перед первым входом или устранить сетевую проблему с этого экрана не получится.
  recommendation: Оставляйте включённым на ноутбуках; выключайте только при понятном сценарии администрирования.
  technical_details: Изменяется 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\System\DontDisplayNetworkSelectionUI. Значение 1 скрывает значок.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: Выключено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\System'
        value_name: DontDisplayNetworkSelectionUI
        view: registry64
        value: 1
  enabled:
    title: Включено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\System'
        value_name: DontDisplayNetworkSelectionUI
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\System'
  value_name: DontDisplayNetworkSelectionUI
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
