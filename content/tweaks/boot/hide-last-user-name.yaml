id: boot.hide-last-user-name
title: Скрытие имени последнего пользователя
category: boot
subcategory: sign-in
kind: setting
summary: Не показывает на экране входа имя учётной записи, которая входила последней.
explanation:
  purpose: Заставляет форму входа запрашивать имя учётной записи, а не подставлять последнего пользователя.
  mechanism: Системная политика dontdisplaylastusername меняет состав полей стандартной формы входа.
  effect: На экране входа нужно вводить и имя пользователя, и пароль.
  tradeoffs: Вход становится менее удобным, особенно на личном компьютере с одной учётной записью.
  recommendation: Включайте на общих компьютерах, если имена учётных записей не должны показываться заранее.
  technical_details: Изменяется 32-битный DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\dontdisplaylastusername. Значение 1 скрывает имя.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: Выключено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: dontdisplaylastusername
        view: registry64
        value: 0
  enabled:
    title: Включено
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: dontdisplaylastusername
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: dontdisplaylastusername
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
