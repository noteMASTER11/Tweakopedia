id: boot.lock-screen-spotlight-overlay
title: 'Информационный слой Windows Spotlight'
category: boot
subcategory: lock-screen
kind: setting
summary: 'Управляет информационными надписями поверх изображения Windows Spotlight на экране блокировки.'
explanation:
  purpose: 'Позволяет убрать подписи и интерактивный слой, не обязательно меняя само изображение.'
  mechanism: 'Параметр RotatingLockScreenOverlayEnabled задаёт показ слоя поверх сменяемого фона.'
  effect: 'При отключении информационный слой Spotlight на экране блокировки скрывается.'
  tradeoffs: 'Сведения об изображении и связанные действия не будут показываться.'
  recommendation: 'Отключайте для более чистого вида экрана блокировки.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\RotatingLockScreenOverlayEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: RotatingLockScreenOverlayEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: RotatingLockScreenOverlayEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
  value_name: RotatingLockScreenOverlayEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false
