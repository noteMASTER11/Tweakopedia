id: boot.lock-screen-app-notifications
title: 'Уведомления приложений на экране блокировки'
category: boot
subcategory: sign-in
kind: setting
summary: 'Показывает или скрывает уведомления приложений до входа пользователя.'
explanation: {purpose: 'Управляет уведомлениями приложений на экране блокировки.', mechanism: 'Инвертированный параметр DisableLockScreenAppNotifications включает или скрывает их показ.', effect: 'При скрытии содержимое уведомлений не отображается до разблокировки.', tradeoffs: 'Быстрый просмотр новых событий без входа становится недоступен.', recommendation: 'Скрывайте на компьютерах, экран которых видят посторонние.', technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\System\DisableLockScreenAppNotifications: 0 — показывать, 1 — скрывать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  shown: {title: 'Показывать', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\System', value_name: DisableLockScreenAppNotifications, view: registry64, value: 0}]}
  hidden: {title: 'Скрывать', operations: [{type: registry.set_dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\System', value_name: DisableLockScreenAppNotifications, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: shown}, {os: windows11, builds: [22000, 26200], state: shown}]
detect: {type: registry.dword, hive: HKLM, key: 'Software\Policies\Microsoft\Windows\System', value_name: DisableLockScreenAppNotifications, view: registry64, states: {0: shown, 1: hidden}, missing_state: shown}
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false
