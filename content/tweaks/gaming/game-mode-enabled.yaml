id: gaming.game-mode-enabled
title: 'Игровой режим Windows'
category: gaming
subcategory: performance
kind: setting
summary: 'Включает или выключает системный игровой режим.'
explanation:
  purpose: 'Управляет пользовательским состоянием игрового режима Windows.'
  mechanism: 'Windows читает DWORD AutoGameModeEnabled и применяет выбранный режим.'
  effect: 'При включении Windows применяет связанные приоритеты фоновой активности во время игры.'
  tradeoffs: 'На части конфигураций разница незаметна или зависит от конкретной игры.'
  recommendation: 'Оставляйте включённым для игрового компьютера и сравнивайте результат в своих играх.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\GameBar\AutoGameModeEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 15063
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\GameBar'
        value_name: 'AutoGameModeEnabled'
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\GameBar'
        value_name: 'AutoGameModeEnabled'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [15063, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\GameBar'
  value_name: 'AutoGameModeEnabled'
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
