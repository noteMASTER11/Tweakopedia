id: gaming.app-capture-user
title: 'Захват приложений в профиле пользователя'
category: gaming
subcategory: capture
kind: setting
summary: 'Разрешает или запрещает захват приложений средствами Windows в текущем профиле.'
explanation:
  purpose: 'Управляет пользовательским переключателем захвата экрана для Game DVR и Game Bar.'
  mechanism: 'Параметр AppCaptureEnabled задаёт доступность захвата приложений.'
  effect: 'При отключении системный захват приложений для текущего пользователя не работает.'
  tradeoffs: 'Запись экрана и клипов средствами Windows может стать недоступна.'
  recommendation: 'Отключайте при использовании другого средства записи.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR\AppCaptureEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
        value_name: AppCaptureEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
        value_name: AppCaptureEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
  value_name: AppCaptureEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
