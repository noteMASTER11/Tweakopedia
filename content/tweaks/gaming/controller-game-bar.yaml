id: gaming.controller-game-bar
title: 'Открытие Xbox Game Bar кнопкой геймпада'
category: gaming
subcategory: capture
kind: setting
summary: 'Управляет запуском Xbox Game Bar центральной кнопкой совместимого контроллера.'
explanation:
  purpose: 'Управляет запуском Xbox Game Bar центральной кнопкой совместимого контроллера.'
  mechanism: 'Windows или приложение читает DWORD UseNexusForGameBarEnabled и применяет соответствующий режим.'
  effect: 'При выключении кнопка контроллера не открывает игровую панель.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте, если кнопка срабатывает случайно или Game Bar не используется.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\GameBar\UseNexusForGameBarEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\GameBar'
        value_name: UseNexusForGameBarEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\GameBar'
        value_name: UseNexusForGameBarEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\GameBar'
  value_name: UseNexusForGameBarEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
