id: power.hibernation
title: 'Гибернация'
category: power
subcategory: sleep
kind: setting
summary: 'Управляет сохранением сеанса на диск и переходом в гибернацию.'
explanation:
  purpose: 'Управляет сохранением сеанса на диск и переходом в гибернацию.'
  mechanism: 'Параметр HibernateEnabled задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении команда гибернации и функции, зависящие от hiberfil.sys, могут стать недоступны.'
  tradeoffs: 'Отключение освобождает место, но может затронуть быстрый запуск.'
  recommendation: 'Оставляйте включённой на ноутбуках и при использовании быстрого запуска.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SYSTEM\CurrentControlSet\Control\Power\HibernateEnabled.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключена'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power'
        value_name: HibernateEnabled
        view: registry64
        value: 0
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Session Manager\Power'
        value_name: HibernateEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включена'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power'
        value_name: HibernateEnabled
        view: registry64
        value: 1
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Session Manager\Power'
        value_name: HibernateEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Power'
  value_name: HibernateEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: medium
reversibility: reversible
requires_network: false
