id: power.advanced-low-battery-action
title: 'Отображение: Действие низкого заряда батарей'
category: power
subcategory: advanced-battery
kind: setting
summary: 'Показывает или скрывает параметр «Действие низкого заряда батарей» в дополнительных настройках схемы электропитания.'
explanation:
  purpose: 'Показывает или скрывает параметр «Действие низкого заряда батарей» в дополнительных настройках схемы электропитания.'
  mechanism: 'Windows читает DWORD Attributes у определения параметра питания; флаг POWER_ATTRIBUTE_HIDE управляет его отображением.'
  effect: 'Меняется только доступность элемента интерфейса; текущие значения схем питания не изменяются.'
  tradeoffs: 'Параметр может не влиять на компьютер без соответствующего оборудования или функции.'
  recommendation: 'Показывайте параметр, когда требуется его ручная настройка в классической панели электропитания.'
  technical_details: 'DWORD HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\e73a048d-bf27-4f12-9731-8b2076e8891f\d8742dcb-3e6a-4b3c-b3fe-374623cdcf06\Attributes: 1 — скрыт, 2 — показан. Группа e73a048d-bf27-4f12-9731-8b2076e8891f, параметр d8742dcb-3e6a-4b3c-b3fe-374623cdcf06.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  hidden:
    title: 'Скрыт'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\e73a048d-bf27-4f12-9731-8b2076e8891f\d8742dcb-3e6a-4b3c-b3fe-374623cdcf06'
        value_name: Attributes
        view: registry64
        value: 1
  visible:
    title: 'Показан'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\e73a048d-bf27-4f12-9731-8b2076e8891f\d8742dcb-3e6a-4b3c-b3fe-374623cdcf06'
        value_name: Attributes
        view: registry64
        value: 2
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: visible
  - os: windows11
    builds: [22000, 26200]
    state: visible
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\e73a048d-bf27-4f12-9731-8b2076e8891f\d8742dcb-3e6a-4b3c-b3fe-374623cdcf06'
  value_name: Attributes
  view: registry64
  states:
    1: hidden
    2: visible
  missing_state: visible
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
