id: power.password-on-resume-ac
title: 'Пароль после выхода из сна — от сети'
category: power
subcategory: sleep
kind: setting
summary: 'Управляет запросом пароля после выхода из сна при питании от электросети.'
explanation:
  purpose: 'Позволяет отдельно задать запрос учётных данных после сна при подключённом питании.'
  mechanism: 'Политика ACSettingIndex управляет запросом пароля для режима от электросети.'
  effect: 'При отключении Windows не запрашивает пароль после пробуждения в этом режиме питания.'
  tradeoffs: 'Любой человек с физическим доступом сможет продолжить открытый сеанс после пробуждения.'
  recommendation: 'Оставляйте включённым на общих и переносных компьютерах.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51\ACSettingIndex: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
        value_name: ACSettingIndex
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
        value_name: ACSettingIndex
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
  value_name: ACSettingIndex
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
