id: power.advanced-allow-wake-timers
title: 'Отображение: Разрешить таймеры пробуждения'
category: power
subcategory: advanced-sleep
kind: setting
summary: 'Показывает или скрывает параметр «Разрешить таймеры пробуждения» в дополнительных настройках схемы электропитания.'
explanation:
  purpose: 'Показывает или скрывает параметр «Разрешить таймеры пробуждения» в дополнительных настройках схемы электропитания.'
  mechanism: 'Windows читает DWORD Attributes у определения параметра питания; флаг POWER_ATTRIBUTE_HIDE управляет его отображением.'
  effect: 'Меняется только доступность элемента интерфейса; текущие значения схем питания не изменяются.'
  tradeoffs: 'Параметр может не влиять на компьютер без соответствующего оборудования или функции.'
  recommendation: 'Показывайте параметр, когда требуется его ручная настройка в классической панели электропитания.'
  technical_details: 'DWORD HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\238C9FA8-0AAD-41ED-83F4-97BE242C8F20\BD3B718A-0680-4D9D-8AB2-E1D2B4AC806D\Attributes: 1 — скрыт, 2 — показан. Группа 238c9fa8-0aad-41ed-83f4-97be242c8f20, параметр bd3b718a-0680-4d9d-8ab2-e1d2b4ac806d.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  hidden:
    title: 'Скрыт'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\238C9FA8-0AAD-41ED-83F4-97BE242C8F20\BD3B718A-0680-4D9D-8AB2-E1D2B4AC806D'
        value_name: Attributes
        view: registry64
        value: 1
  visible:
    title: 'Показан'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\238C9FA8-0AAD-41ED-83F4-97BE242C8F20\BD3B718A-0680-4D9D-8AB2-E1D2B4AC806D'
        value_name: Attributes
        view: registry64
        value: 2
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: visible
  - os: windows11
    builds: [22000, 26200]
    state: visible
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\238C9FA8-0AAD-41ED-83F4-97BE242C8F20\BD3B718A-0680-4D9D-8AB2-E1D2B4AC806D'
  value_name: Attributes
  view: registry64
  states:
    1: hidden
    2: visible
  missing_state: visible
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
