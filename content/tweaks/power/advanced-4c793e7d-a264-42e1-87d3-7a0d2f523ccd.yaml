id: power.advanced-javascript-timer-frequency
title: 'Отображение: Частота таймера JavaScript'
category: power
subcategory: advanced-display
kind: setting
summary: 'Показывает или скрывает параметр «Частота таймера JavaScript» в дополнительных настройках схемы электропитания.'
explanation:
  purpose: 'Показывает или скрывает параметр «Частота таймера JavaScript» в дополнительных настройках схемы электропитания.'
  mechanism: 'Windows читает DWORD Attributes у определения параметра питания; флаг POWER_ATTRIBUTE_HIDE управляет его отображением.'
  effect: 'Меняется только доступность элемента интерфейса; текущие значения схем питания не изменяются.'
  tradeoffs: 'Параметр может не влиять на компьютер без соответствующего оборудования или функции.'
  recommendation: 'Показывайте параметр, когда требуется его ручная настройка в классической панели электропитания.'
  technical_details: 'DWORD HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\02F815B5-A5CF-4C84-BF20-649D1F75D3D8\4c793e7d-a264-42e1-87d3-7a0d2f523ccd\Attributes: 1 — скрыт, 2 — показан. Группа 02f815b5-a5cf-4c84-bf20-649d1f75d3d8, параметр 4c793e7d-a264-42e1-87d3-7a0d2f523ccd.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  hidden:
    title: 'Скрыт'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\02F815B5-A5CF-4C84-BF20-649D1F75D3D8\4c793e7d-a264-42e1-87d3-7a0d2f523ccd'
        value_name: Attributes
        view: registry64
        value: 1
  visible:
    title: 'Показан'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\02F815B5-A5CF-4C84-BF20-649D1F75D3D8\4c793e7d-a264-42e1-87d3-7a0d2f523ccd'
        value_name: Attributes
        view: registry64
        value: 2
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: hidden
  - os: windows11
    builds: [22000, 26200]
    state: hidden
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\02F815B5-A5CF-4C84-BF20-649D1F75D3D8\4c793e7d-a264-42e1-87d3-7a0d2f523ccd'
  value_name: Attributes
  view: registry64
  states:
    1: hidden
    2: visible
  missing_state: hidden
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
