id: power.hybrid-sleep-dc
title: 'Гибридный спящий режим — от батареи'
category: power
subcategory: sleep
kind: setting
summary: 'Управляет гибридным спящим режимом при работе от батареи.'
explanation:
  purpose: 'Сочетает быстрый выход из сна с сохранением содержимого памяти на диск.'
  mechanism: 'Политика DCSettingIndex управляет гибридным сном для режима от батареи.'
  effect: 'При включении Windows сохраняет сеанс в файл гибернации перед переходом в сон.'
  tradeoffs: 'Создание копии памяти на диске увеличивает расход заряда перед сном.'
  recommendation: 'На ноутбуках включайте, если сохранение сеанса важнее минимального расхода заряда.'
  technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Power\PowerSettings\94ac6d29-73ce-41a6-809f-6363ba21b47e\DCSettingIndex: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Power\PowerSettings\94ac6d29-73ce-41a6-809f-6363ba21b47e'
        value_name: DCSettingIndex
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Power\PowerSettings\94ac6d29-73ce-41a6-809f-6363ba21b47e'
        value_name: DCSettingIndex
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Power\PowerSettings\94ac6d29-73ce-41a6-809f-6363ba21b47e'
  value_name: DCSettingIndex
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: [power.hibernation]
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
