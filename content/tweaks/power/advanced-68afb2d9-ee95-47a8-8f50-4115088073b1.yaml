id: power.advanced-disconnected-standby-mode
title: 'Отображение: Режим ожидания с отключением'
category: power
subcategory: advanced-sleep
kind: setting
summary: 'Показывает или скрывает параметр «Режим ожидания с отключением» в дополнительных настройках схемы электропитания.'
explanation:
  purpose: 'Показывает или скрывает параметр «Режим ожидания с отключением» в дополнительных настройках схемы электропитания.'
  mechanism: 'Windows читает DWORD Attributes у определения параметра питания; флаг POWER_ATTRIBUTE_HIDE управляет его отображением.'
  effect: 'Меняется только доступность элемента интерфейса; текущие значения схем питания не изменяются.'
  tradeoffs: 'Параметр может не влиять на компьютер без соответствующего оборудования или функции.'
  recommendation: 'Показывайте параметр, когда требуется его ручная настройка в классической панели электропитания.'
  technical_details: 'DWORD HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\68AFB2D9-EE95-47A8-8F50-4115088073B1\Attributes: 1 — скрыт, 2 — показан. Группа 68afb2d9-ee95-47a8-8f50-4115088073b1, параметр 68afb2d9-ee95-47a8-8f50-4115088073b1.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  hidden:
    title: 'Скрыт'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\68AFB2D9-EE95-47A8-8F50-4115088073B1'
        value_name: Attributes
        view: registry64
        value: 1
  visible:
    title: 'Показан'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\68AFB2D9-EE95-47A8-8F50-4115088073B1'
        value_name: Attributes
        view: registry64
        value: 2
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: hidden
  - os: windows11
    builds: [22000, 26200]
    state: hidden
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\68AFB2D9-EE95-47A8-8F50-4115088073B1'
  value_name: Attributes
  view: registry64
  states:
    1: hidden
    2: visible
  missing_state: hidden
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
