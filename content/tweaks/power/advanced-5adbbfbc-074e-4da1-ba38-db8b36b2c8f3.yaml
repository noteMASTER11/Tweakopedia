id: power.advanced-non-sensor-input-presence-time-out
title: 'Отображение: Время ожидания входного сигнала не с датчика присутствия'
category: power
subcategory: advanced-platform
kind: setting
summary: 'Показывает или скрывает параметр «Время ожидания входного сигнала не с датчика присутствия» в дополнительных настройках схемы электропитания.'
explanation:
  purpose: 'Показывает или скрывает параметр «Время ожидания входного сигнала не с датчика присутствия» в дополнительных настройках схемы электропитания.'
  mechanism: 'Windows читает DWORD Attributes у определения параметра питания; флаг POWER_ATTRIBUTE_HIDE управляет его отображением.'
  effect: 'Меняется только доступность элемента интерфейса; текущие значения схем питания не изменяются.'
  tradeoffs: 'Параметр может не влиять на компьютер без соответствующего оборудования или функции.'
  recommendation: 'Показывайте параметр, когда требуется его ручная настройка в классической панели электропитания.'
  technical_details: 'DWORD HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerSettings\8619B916-E004-4dd8-9B66-DAE86F806698\5ADBBFBC-074E-4da1-BA38-DB8B36B2C8F3\Attributes: 1 — скрыт, 2 — показан. Группа 8619b916-e004-4dd8-9b66-dae86f806698, параметр 5adbbfbc-074e-4da1-ba38-db8b36b2c8f3.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  hidden:
    title: 'Скрыт'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\8619B916-E004-4dd8-9B66-DAE86F806698\5ADBBFBC-074E-4da1-BA38-DB8B36B2C8F3'
        value_name: Attributes
        view: registry64
        value: 1
  visible:
    title: 'Показан'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\8619B916-E004-4dd8-9B66-DAE86F806698\5ADBBFBC-074E-4da1-BA38-DB8B36B2C8F3'
        value_name: Attributes
        view: registry64
        value: 2
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: hidden
  - os: windows11
    builds: [22000, 26200]
    state: hidden
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Power\PowerSettings\8619B916-E004-4dd8-9B66-DAE86F806698\5ADBBFBC-074E-4da1-BA38-DB8B36B2C8F3'
  value_name: Attributes
  view: registry64
  states:
    1: hidden
    2: visible
  missing_state: hidden
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
