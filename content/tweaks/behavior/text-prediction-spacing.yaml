id: behavior.text-prediction-spacing
title: 'Пробел после текстового предложения'
category: behavior
subcategory: input
kind: setting
summary: 'Управляет автоматической вставкой пробела после выбора предложенного слова.'
explanation:
  purpose: 'Управляет автоматической вставкой пробела после выбора предложенного слова.'
  mechanism: 'Параметр TurnOffInsertSpace задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении пробел после принятого предложения нужно вводить вручную.'
  tradeoffs: 'Изменение заметно только при включённых текстовых предложениях.'
  recommendation: 'Настраивайте по привычному способу набора текста.'
  technical_details: 'Основной объект — 32-битный DWORD HKCU\SOFTWARE\Policies\Microsoft\Control Panel\International\TurnOffInsertSpace.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
        value_name: TurnOffInsertSpace
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
        value_name: TurnOffInsertSpace
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
  value_name: TurnOffInsertSpace
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
