id: behavior.snap-bar
title: 'Панель привязки у верхнего края'
category: behavior
subcategory: windows
kind: setting
summary: 'Показывает или скрывает панель макетов при перетаскивании окна к верхнему краю.'
explanation:
  purpose: 'Управляет верхней панелью Snap Bar отдельно от привязки окон в целом.'
  mechanism: 'Параметр EnableSnapBar задаёт появление панели макетов у верхней границы экрана.'
  effect: 'При отключении перетаскивание окна вверх не раскрывает панель макетов.'
  tradeoffs: 'Выбор макета перетаскиванием станет недоступен, но другие способы привязки могут сохраниться.'
  recommendation: 'Оставляйте включённым при активном использовании макетов окон.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\EnableSnapBar: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: EnableSnapBar
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: EnableSnapBar
        view: registry64
        value: 1
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: EnableSnapBar
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
