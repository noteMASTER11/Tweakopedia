id: behavior.autoplay-user
title: 'Автовоспроизведение для текущего пользователя'
category: behavior
subcategory: media
kind: setting
summary: 'Разрешает или запрещает обработку носителей средствами автозапуска текущего пользователя.'
explanation:
  purpose: 'Управляет пользовательским переключателем автовоспроизведения.'
  mechanism: 'Windows читает DWORD DisableAutoplay и применяет выбранный режим.'
  effect: 'При выключении Windows не предлагает автоматически обработать подключённый носитель через Autoplay.'
  tradeoffs: 'Действие для камеры, телефона или диска придётся выбирать вручную.'
  recommendation: 'Отключайте, если автоматические действия при подключении носителей не нужны.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers\DisableAutoplay: 0 — включено, 1 — выключено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers'
        value_name: 'DisableAutoplay'
        view: registry64
        value: 0
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers'
        value_name: 'DisableAutoplay'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\AutoplayHandlers'
  value_name: 'DisableAutoplay'
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
