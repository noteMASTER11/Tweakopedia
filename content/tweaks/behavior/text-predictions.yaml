id: behavior.text-predictions
title: 'Текстовые предложения при вводе'
category: behavior
subcategory: input
kind: setting
summary: 'Управляет предложениями слов и продолжений текста.'
explanation:
  purpose: 'Управляет предложениями слов и продолжений текста.'
  mechanism: 'Параметр TurnOffOfferTextPredictions задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении варианты продолжения текста не появляются.'
  tradeoffs: 'Быстрый ввод с выбором готовых слов становится недоступен.'
  recommendation: 'Отключайте, если предложения отвлекают или не подходят для используемых языков.'
  technical_details: 'Основной объект — 32-битный DWORD HKCU\SOFTWARE\Policies\Microsoft\Control Panel\International\TurnOffOfferTextPredictions.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
        value_name: TurnOffOfferTextPredictions
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
        value_name: TurnOffOfferTextPredictions
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
  value_name: TurnOffOfferTextPredictions
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
