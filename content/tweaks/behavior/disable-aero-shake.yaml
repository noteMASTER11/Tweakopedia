id: behavior.disable-aero-shake
title: Блокировка Aero Shake
category: behavior
subcategory: windows
kind: setting
summary: Не позволяет жесту встряхивания активного окна сворачивать остальные окна.
explanation:
  purpose: Убирает случайное сворачивание фоновых окон при резком перемещении активного окна мышью.
  mechanism: Пользовательская политика NoWindowMinimizingShortcuts запрещает оболочке выполнять жест Aero Shake.
  effect: Встряхивание активного окна больше не меняет состояние остальных окон.
  tradeoffs: Быстро свернуть все остальные окна этим жестом будет нельзя; другие способы сворачивания сохраняются.
  recommendation: Включайте блокировку, если Aero Shake срабатывает случайно или не используется.
  technical_details: Изменяется 32-битный DWORD HKCU\Software\Policies\Microsoft\Windows\Explorer\NoWindowMinimizingShortcuts. Значение 1 блокирует жест, 0 разрешает его.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: Выключено
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\Explorer'
        value_name: NoWindowMinimizingShortcuts
        view: registry64
        value: 0
  enabled:
    title: Включено
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\Explorer'
        value_name: NoWindowMinimizingShortcuts
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Policies\Microsoft\Windows\Explorer'
  value_name: NoWindowMinimizingShortcuts
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
