id: behavior.user-action-recorder
title: 'Запись действий пользователя для совместимости'
category: behavior
subcategory: windows
kind: setting
summary: 'Разрешает или запрещает компоненту совместимости записывать действия пользователя.'
explanation:
  purpose: 'Управляет User Action Record, используемым диагностикой совместимости приложений.'
  mechanism: 'Windows применяет групповую политику через DWORD DisableUAR.'
  effect: 'При выключении соответствующая история действий не собирается компонентом AppCompat.'
  tradeoffs: 'Автоматическая диагностика некоторых сбоев приложений получит меньше контекста.'
  recommendation: 'Отключайте, если диагностическая запись действий не требуется.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\AppCompat\DisableUAR: 0 — разрешена, 1 — запрещена.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  enabled:
    title: 'Разрешена'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\AppCompat'
        value_name: 'DisableUAR'
        view: registry64
        value: 0
  disabled:
    title: 'Запрещена'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\AppCompat'
        value_name: 'DisableUAR'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\AppCompat'
  value_name: 'DisableUAR'
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
