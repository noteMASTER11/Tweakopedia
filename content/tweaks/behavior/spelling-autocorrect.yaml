id: behavior.spelling-autocorrect
title: 'Автоматическое исправление опечаток'
category: behavior
subcategory: input
kind: setting
summary: 'Управляет автоматической заменой распознанных опечаток.'
explanation:
  purpose: 'Управляет автоматической заменой распознанных опечаток.'
  mechanism: 'Параметр TurnOffAutocorrectMisspelledWords задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении слова остаются введёнными без автоматической замены.'
  tradeoffs: 'Опечатки придётся исправлять вручную.'
  recommendation: 'Отключайте, если автоисправление мешает вводу терминов, кода или нескольких языков.'
  technical_details: 'Основной объект — 32-битный DWORD HKCU\SOFTWARE\Policies\Microsoft\Control Panel\International\TurnOffAutocorrectMisspelledWords.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
        value_name: TurnOffAutocorrectMisspelledWords
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
        value_name: TurnOffAutocorrectMisspelledWords
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Policies\Microsoft\Control Panel\International'
  value_name: TurnOffAutocorrectMisspelledWords
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
