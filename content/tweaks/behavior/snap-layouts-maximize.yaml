id: behavior.snap-layouts-maximize
title: 'Макеты привязки на кнопке разворачивания'
category: behavior
subcategory: windows
kind: setting
summary: 'Показывает или скрывает макеты привязки при наведении на кнопку разворачивания окна.'
explanation:
  purpose: 'Управляет всплывающей панелью Snap Assist на кнопке разворачивания.'
  mechanism: 'Параметр EnableSnapAssistFlyout задаёт появление набора макетов при наведении.'
  effect: 'При отключении наведение на кнопку разворачивания не показывает варианты размещения.'
  tradeoffs: 'Быстрый выбор макета мышью станет недоступен.'
  recommendation: 'Оставляйте включённым, если используете макеты привязки Windows 11.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\EnableSnapAssistFlyout: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: EnableSnapAssistFlyout
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: EnableSnapAssistFlyout
        view: registry64
        value: 1
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: EnableSnapAssistFlyout
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
