id: updates.pause-access
title: 'Доступ к приостановке обновлений'
category: updates
subcategory: automatic
kind: setting
summary: 'Разрешает или запрещает пользователю приостанавливать обновления через «Параметры».'
explanation:
  purpose: 'Управляет доступностью элементов приостановки обновлений в интерфейсе Windows Update.'
  mechanism: 'Windows применяет параметр через DWORD SetDisablePauseUXAccess.'
  effect: 'При запрете пользователь не сможет поставить обновления на паузу через обычный интерфейс.'
  tradeoffs: 'Временно отложить установку обновлений самостоятельно станет нельзя.'
  recommendation: 'Оставляйте доступным на личном компьютере.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\WindowsUpdate\SetDisablePauseUXAccess: 0 — доступна, 1 — недоступна.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 17763
states:
  enabled:
    title: 'Доступна'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\WindowsUpdate'
        value_name: 'SetDisablePauseUXAccess'
        view: registry64
        value: 0
  disabled:
    title: 'Недоступна'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\WindowsUpdate'
        value_name: 'SetDisablePauseUXAccess'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [17763, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\WindowsUpdate'
  value_name: 'SetDisablePauseUXAccess'
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
