id: updates.wake-for-installation
title: 'Пробуждение компьютера для установки обновлений'
category: updates
subcategory: automatic
kind: setting
summary: 'Разрешает или запрещает Windows Update пробуждать компьютер для запланированной установки.'
explanation:
  purpose: 'Управляет таймерами пробуждения, создаваемыми Windows Update.'
  mechanism: 'Windows применяет параметр через DWORD AUPowerManagement.'
  effect: 'При включении спящий компьютер может автоматически проснуться для установки запланированных обновлений.'
  tradeoffs: 'Компьютер способен включиться в неудобное время; при запрете установка откладывается до следующего периода активности.'
  recommendation: 'Отключайте на ноутбуке или компьютере в спальне.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\WindowsUpdate\AUPowerManagement: 0 — запрещено, 1 — разрешено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Запрещено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\WindowsUpdate'
        value_name: 'AUPowerManagement'
        view: registry64
        value: 0
  enabled:
    title: 'Разрешено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\WindowsUpdate'
        value_name: 'AUPowerManagement'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\WindowsUpdate'
  value_name: 'AUPowerManagement'
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
