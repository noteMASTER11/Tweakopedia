id: network.ipv6-940fb02e45
title: 'Общий доступ к подключению к Интернету IPv6 (отключить) — параметр Teredo_State'
category: network
subcategory: performance
kind: setting
summary: 'Управляет значением реестра Teredo_State и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра Teredo_State или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Policies\Microsoft\Windows\TCPIP\v6Transition\Teredo_State; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Строка «Disabled»'
    operations:
      - type: registry.set_value
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\TCPIP\v6Transition'
        value_name: 'Teredo_State'
        view: registry64
        value_type: string
        value: 'Disabled'
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\TCPIP\v6Transition'
        value_name: 'Teredo_State'
        view: registry64
windows_defaults: []
detect:
  type: registry.value
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\TCPIP\v6Transition'
  value_name: 'Teredo_State'
  view: registry64
  states:
    value_0:
      value_type: string
      value: 'Disabled'
  missing_state: absent
dependencies: []
conflicts: []
restart: none
impact: medium
