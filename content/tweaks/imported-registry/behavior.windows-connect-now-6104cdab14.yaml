id: behavior.windows-connect-now-6104cdab14
title: 'Запретить доступ мастерам Windows Connect Now (включить) — параметр DisableFlashConfigRegistrar'
category: behavior
subcategory: group-policy
kind: setting
summary: 'Управляет значением реестра DisableFlashConfigRegistrar и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра DisableFlashConfigRegistrar или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars\DisableFlashConfigRegistrar; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Значение 0'
    operations:
      - type: registry.set_value
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
        value_name: 'DisableFlashConfigRegistrar'
        view: registry64
        value_type: dword
        value: 0
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
        value_name: 'DisableFlashConfigRegistrar'
        view: registry64
windows_defaults: []
detect:
  type: registry.value
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
  value_name: 'DisableFlashConfigRegistrar'
  view: registry64
  states:
    value_0:
      value_type: dword
      value: 0
  missing_state: absent
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
