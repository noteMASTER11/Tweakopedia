id: behavior.enable-telemetry-7637b55eee
title: 'Enable_Telemetry — параметр ShowedToastAtLevel'
category: behavior
subcategory: windows
kind: setting
summary: 'Управляет значением реестра ShowedToastAtLevel и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра ShowedToastAtLevel или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Diagnostics\DiagTrack\ShowedToastAtLevel; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Значение 3'
    operations:
      - type: registry.set_value
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Diagnostics\DiagTrack'
        value_name: 'ShowedToastAtLevel'
        view: registry64
        value_type: dword
        value: 3
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Diagnostics\DiagTrack'
        value_name: 'ShowedToastAtLevel'
        view: registry64
windows_defaults: []
detect:
  type: registry.value
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Diagnostics\DiagTrack'
  value_name: 'ShowedToastAtLevel'
  view: registry64
  states:
    value_0:
      value_type: dword
      value: 3
  missing_state: absent
dependencies: []
conflicts: []
restart: none
impact: low
