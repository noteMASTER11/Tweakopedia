id: behavior.mozilla-firefox-e09ae9ebb4
title: 'Отключить нежелательное в браузере Mozilla Firefox — параметр browser.safebrowsing.malware.enabled'
category: behavior
subcategory: group-policy
kind: setting
summary: 'Управляет значением реестра browser.safebrowsing.malware.enabled и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра browser.safebrowsing.malware.enabled или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Policies\Mozilla\Firefox\Preferences\browser.safebrowsing.malware.enabled; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
