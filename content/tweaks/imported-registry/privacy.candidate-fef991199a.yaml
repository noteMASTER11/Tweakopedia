id: privacy.candidate-fef991199a
title: 'Включить камеру и микрофон (по умолчанию) — параметр value'
category: privacy
subcategory: app-permissions
kind: setting
summary: 'Управляет значением реестра value и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра value или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\value; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Строка «Allow»'
    operations:
      - type: registry.set_value
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
        value_name: 'value'
        view: registry64
        value_type: string
        value: 'Allow'
  value_1:
    title: 'Строка «Deny»'
    operations:
      - type: registry.set_value
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
        value_name: 'value'
        view: registry64
