id: desktop.hide-onedrive-folder-073b495c88
title: 'Hide_Onedrive_Folder — параметр Id'
category: desktop
subcategory: explorer
kind: setting
summary: 'Управляет значением реестра Id и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра Id или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowOneDrive\Id; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Значение 13'
    operations:
      - type: registry.set_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowOneDrive'
        value_name: 'Id'
        view: registry64
        value_type: dword
        value: 13
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowOneDrive'
        value_name: 'Id'
        view: registry64
windows_defaults: []
detect:
