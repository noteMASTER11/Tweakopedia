id: desktop.hide-gallery-from-explorer-efcc432470
title: 'Hide_Gallery_from_Explorer — параметр RegPath'
category: desktop
subcategory: explorer
kind: setting
summary: 'Управляет значением реестра RegPath и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра RegPath или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowGallery\RegPath; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Строка «Software\\Classes\\CLSID\\{e88865ea-0e1c-4e20-9aa6-ed…»'
    operations:
      - type: registry.set_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowGallery'
        value_name: 'RegPath'
        view: registry64
        value_type: string
        value: 'Software\\Classes\\CLSID\\{e88865ea-0e1c-4e20-9aa6-edcd0212c87c}'
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowGallery'
        value_name: 'RegPath'
        view: registry64
windows_defaults: []
detect:
