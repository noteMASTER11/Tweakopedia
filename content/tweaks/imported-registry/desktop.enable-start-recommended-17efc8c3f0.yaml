id: desktop.enable-start-recommended-17efc8c3f0
title: 'Enable_Start_Recommended — параметр Start_Layout'
category: desktop
subcategory: explorer
kind: setting
summary: 'Управляет значением реестра Start_Layout и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра Start_Layout или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Start_Layout; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Значение 0'
    operations:
      - type: registry.set_value
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: 'Start_Layout'
        view: registry64
        value_type: dword
        value: 0
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: 'Start_Layout'
        view: registry64
windows_defaults: []
detect:
  type: registry.value
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: 'Start_Layout'
  view: registry64
  states:
    value_0:
      value_type: dword
      value: 0
  missing_state: absent
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
