id: desktop.hide-gallery-from-explorer-6b63437a6a
title: 'Hide_Gallery_from_Explorer — параметр Text'
category: desktop
subcategory: explorer
kind: setting
summary: 'Управляет значением реестра Text и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра Text или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowGallery\Text; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Строка «Show Gallery»'
    operations:
      - type: registry.set_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowGallery'
        value_name: 'Text'
        view: registry64
        value_type: string
        value: 'Show Gallery'
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowGallery'
        value_name: 'Text'
        view: registry64
windows_defaults: []
detect:
  type: registry.value
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\NavPane\ShowGallery'
  value_name: 'Text'
  view: registry64
  states:
    value_0:
      value_type: string
      value: 'Show Gallery'
  missing_state: absent
dependencies: []
conflicts: []
restart: explorer
impact: medium
reversibility: reversible
requires_network: false
