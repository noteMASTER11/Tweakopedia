id: behavior.xbox-c2e433d5f4
title: 'Отключить поддержку Xbox и игровую панель — параметр GamePanelStartupTipIndex'
category: behavior
subcategory: windows
kind: setting
summary: 'Управляет значением реестра GamePanelStartupTipIndex и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра GamePanelStartupTipIndex или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKCU\SOFTWARE\Microsoft\GameBar\GamePanelStartupTipIndex; представление: registry64.'
compatibility:
