id: desktop.exe-42f3d2af25
title: 'Не запускать указанные exe (включить) — параметр 44'
category: desktop
subcategory: explorer
kind: setting
summary: 'Управляет значением реестра 44 и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра 44 или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun\44; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Строка «wecutil.exe»'
    operations:
      - type: registry.set_value
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun'
        value_name: '44'
        view: registry64
        value_type: string
        value: 'wecutil.exe'
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun'
        value_name: '44'
        view: registry64
windows_defaults: []
detect:
  type: registry.value
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun'
  value_name: '44'
  view: registry64
  states:
    value_0:
      value_type: string
      value: 'wecutil.exe'
  missing_state: absent
dependencies: []
conflicts: []
restart: explorer
impact: medium
