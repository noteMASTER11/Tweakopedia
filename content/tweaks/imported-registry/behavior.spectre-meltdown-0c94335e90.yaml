id: behavior.spectre-meltdown-0c94335e90
title: 'Включить меры по смягчению Spectre и Meltdown — параметр MinVmVersionForCpuBasedMitigations'
category: behavior
subcategory: windows
kind: setting
summary: 'Управляет значением реестра MinVmVersionForCpuBasedMitigations и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра MinVmVersionForCpuBasedMitigations или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\MinVmVersionForCpuBasedMitigations; представление: registry64.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Строка «1.0»'
    operations:
      - type: registry.set_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization'
        value_name: 'MinVmVersionForCpuBasedMitigations'
        view: registry64
        value_type: string
        value: '1.0'
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization'
        value_name: 'MinVmVersionForCpuBasedMitigations'
        view: registry64
windows_defaults: []
detect:
  type: registry.value
  hive: HKLM
