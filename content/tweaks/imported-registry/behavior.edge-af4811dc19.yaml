id: behavior.edge-af4811dc19
title: 'Отключить обновление браузера Edge — параметр CanContinueWithMissingUpdate'
category: behavior
subcategory: windows
kind: setting
summary: 'Управляет значением реестра CanContinueWithMissingUpdate и показывает доступные варианты без скрытых команд.'
explanation:
  purpose: 'Позволяет явно выбрать сохранённое значение параметра CanContinueWithMissingUpdate или удалить его.'
  mechanism: 'Windows и приложения читают этот параметр из реестра; Tweakopedia записывает точный тип и содержимое значения.'
  effect: 'Результат зависит от компонента, которому принадлежит объект. Доступные состояния повторяют однозначные значения из исходных твикеров.'
  tradeoffs: 'Неизвестные текущей версии Windows значения отображаются как пользовательское состояние и не подменяются догадкой.'
  recommendation: 'Перед применением сопоставьте выбранное буквальное значение с описанием и текущим состоянием параметра.'
  technical_details: 'Объект: HKLM\SOFTWARE\Microsoft\EdgeUpdateDev\CanContinueWithMissingUpdate; представление: registry32.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  value_0:
    title: 'Значение 1'
    operations:
      - type: registry.set_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\EdgeUpdateDev'
        value_name: 'CanContinueWithMissingUpdate'
        view: registry32
        value_type: dword
        value: 1
  absent:
    title: 'Значение отсутствует'
    operations:
      - type: registry.delete_value
        hive: HKLM
        key: 'SOFTWARE\Microsoft\EdgeUpdateDev'
        value_name: 'CanContinueWithMissingUpdate'
        view: registry32
windows_defaults: []
detect:
  type: registry.value
  hive: HKLM
  key: 'SOFTWARE\Microsoft\EdgeUpdateDev'
  value_name: 'CanContinueWithMissingUpdate'
  view: registry32
  states:
    value_0:
      value_type: dword
      value: 1
  missing_state: absent
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
