id: desktop.thumbnail-cache
title: 'Локальный кэш миниатюр Проводника'
category: desktop
subcategory: explorer
kind: setting
summary: 'Разрешает или запрещает Проводнику сохранять локальный кэш миниатюр.'
explanation:
  purpose: 'Управляет повторным использованием миниатюр изображений и видео.'
  mechanism: 'Windows читает DWORD DisableThumbnailCache и применяет выбранный режим.'
  effect: 'При отключении кэша Проводник будет повторно создавать миниатюры при открытии папок.'
  tradeoffs: 'Отключение уменьшает объём служебного кэша, но замедляет повторное отображение папок с медиафайлами.'
  recommendation: 'Оставляйте включённым на обычных компьютерах.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\DisableThumbnailCache: 0 — сохранять, 1 — не сохранять.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  enabled:
    title: 'Сохранять'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: 'DisableThumbnailCache'
        view: registry64
        value: 0
  disabled:
    title: 'Не сохранять'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: 'DisableThumbnailCache'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: 'DisableThumbnailCache'
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
