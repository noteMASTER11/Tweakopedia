id: desktop.removable-drive-indexing
title: 'Индексация съёмных накопителей'
category: desktop
subcategory: search
kind: setting
summary: 'Управляет индексированием содержимого подключаемых накопителей.'
explanation:
  purpose: 'Управляет индексированием содержимого подключаемых накопителей.'
  mechanism: 'Параметр DisableRemovableDriveIndexing задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении поиск на съёмном диске может работать медленнее.'
  tradeoffs: 'Снижается фоновая работа, но ухудшается скорость поиска.'
  recommendation: 'Отключайте для редко используемых носителей.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\DisableRemovableDriveIndexing.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: DisableRemovableDriveIndexing
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: DisableRemovableDriveIndexing
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
  value_name: DisableRemovableDriveIndexing
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: service
impact: low
reversibility: reversible
requires_network: false
