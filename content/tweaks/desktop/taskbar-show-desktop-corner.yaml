id: desktop.taskbar-show-desktop-corner
title: 'Показ рабочего стола по правому краю панели задач'
category: desktop
subcategory: taskbar
kind: setting
summary: 'Включает узкую область в правом углу панели задач для сворачивания всех окон.'
explanation:
  purpose: 'Включает узкую область в правом углу панели задач для сворачивания всех окон.'
  mechanism: 'TaskbarSd определяет, реагирует ли край панели задач на щелчок командой «Показать рабочий стол».'
  effect: 'Щелчок по крайнему правому участку сворачивает или восстанавливает все окна.'
  tradeoffs: 'При отключении остаются сочетание Win+D и другие способы показать рабочий стол.'
  recommendation: 'Оставьте включённым, если привыкли нажимать в правый нижний угол.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarSd: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Отключить'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarSd
        view: registry64
        value: 0
  enabled:
    title: 'Включить'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarSd
        view: registry64
        value: 1
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: TaskbarSd
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

