id: desktop.silent-app-installation-user
title: 'Фоновая установка рекомендуемых приложений'
category: desktop
subcategory: start
kind: setting
summary: 'Разрешает или запрещает фоновую установку рекомендуемых приложений.'
explanation:
  purpose: 'Управляет автоматической установкой предложенных приложений без отдельного диалога выбора.'
  mechanism: 'Windows читает DWORD SilentInstalledAppsEnabled в профиле текущего пользователя и применяет выбранный режим.'
  effect: 'При выключении Content Delivery Manager не устанавливает поддерживаемые рекламные приложения в фоне.'
  tradeoffs: 'Приложения, которые Microsoft считает полезными, придётся устанавливать самостоятельно.'
  recommendation: 'Отключайте, если состав приложений должен контролироваться вручную.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\SilentInstalledAppsEnabled: 0 — запрещена, 1 — разрешена.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Запрещена'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: 'SilentInstalledAppsEnabled'
        view: registry64
        value: 0
  enabled:
    title: 'Разрешена'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: 'SilentInstalledAppsEnabled'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
  value_name: 'SilentInstalledAppsEnabled'
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
