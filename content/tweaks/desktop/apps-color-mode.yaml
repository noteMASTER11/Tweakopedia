id: desktop.apps-color-mode
title: 'Цветовой режим приложений'
category: desktop
subcategory: effects
kind: setting
summary: 'Выбирает светлый или тёмный режим для поддерживающих системную тему приложений.'
explanation:
  purpose: 'Переключает оформление приложений, которые используют системный цветовой режим Windows.'
  mechanism: 'AppsUseLightTheme сообщает приложениям, следует ли использовать светлую палитру.'
  effect: 'Поддерживаемые приложения меняют фон, текст и системные элементы управления.'
  tradeoffs: 'Отдельные программы используют собственную тему и могут не учитывать этот параметр.'
  recommendation: 'Выберите режим по предпочтению; на работу системы он не влияет.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize\AppsUseLightTheme: 0 — тёмный, 1 — светлый.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  dark:
    title: 'Тёмный'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
        value_name: AppsUseLightTheme
        view: registry64
        value: 0
  light:
    title: 'Светлый'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
        value_name: AppsUseLightTheme
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: light
  - os: windows11
    builds: [22000, 26200]
    state: light
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
  value_name: AppsUseLightTheme
  view: registry64
  states:
    0: dark
    1: light
  missing_state: light
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false

