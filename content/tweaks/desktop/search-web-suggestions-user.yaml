id: desktop.search-web-suggestions-user
title: 'Веб-предложения поиска: пользовательская политика'
category: desktop
subcategory: taskbar
kind: setting
summary: 'Управляет веб-предложениями в поиске Windows для текущего пользователя.'
explanation:
  purpose: 'Управляет веб-предложениями в поиске Windows для текущего пользователя.'
  mechanism: 'Windows или приложение читает DWORD DisableSearchBoxSuggestions и применяет соответствующий режим.'
  effect: 'При выключении поиск не добавляет предложения из Интернета через этот пользовательский параметр.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте для преимущественно локального поиска.'
  technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows\Explorer\DisableSearchBoxSuggestions: 1 — выключено, 0 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\Explorer'
        value_name: DisableSearchBoxSuggestions
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\Explorer'
        value_name: DisableSearchBoxSuggestions
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Policies\Microsoft\Windows\Explorer'
  value_name: DisableSearchBoxSuggestions
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
