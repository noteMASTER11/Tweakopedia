id: desktop.feature-management-content-user
title: 'Содержимое управления функциями Windows'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Управляет доставкой пользовательского содержимого, связанного с возможностями Windows.'
explanation:
  purpose: 'Разрешает или запрещает Content Delivery Manager обрабатывать материалы управления функциями.'
  mechanism: 'Windows читает DWORD FeatureManagementEnabled в профиле текущего пользователя и применяет выбранный режим.'
  effect: 'При выключении соответствующий канал предложений и ознакомительных материалов не используется.'
  tradeoffs: 'Windows может реже показывать сведения о доступных возможностях.'
  recommendation: 'Отключайте, если такие предложения не представляют ценности.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\FeatureManagementEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: 'FeatureManagementEnabled'
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: 'FeatureManagementEnabled'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
  value_name: 'FeatureManagementEnabled'
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
