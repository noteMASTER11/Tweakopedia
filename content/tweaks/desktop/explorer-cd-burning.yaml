id: desktop.explorer-cd-burning
title: Запись компакт-дисков средствами Проводника
category: desktop
subcategory: explorer
kind: setting
summary: Показывает или скрывает встроенные команды записи CD в Проводнике.
explanation: {purpose: 'Управляет встроенной функцией записи оптических дисков.', mechanism: 'NoCDBurning инвертированно скрывает команды записи оболочки.', effect: 'При отключении Проводник не предлагает записывать файлы на CD.', tradeoffs: 'Сторонние программы записи продолжают работать.', recommendation: 'Отключайте, если встроенная запись не используется.', technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoCDBurning.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  disabled: {title: Выключено, operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: NoCDBurning, view: registry64, value: 1}]}
  enabled: {title: Включено, operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: NoCDBurning, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: NoCDBurning, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
