id: desktop.windows-spotlight-settings
title: 'Windows Spotlight в приложении «Параметры»'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Показывает или скрывает рекомендации Windows Spotlight в приложении «Параметры».'
explanation:
  purpose: 'Управляет контекстными предложениями Spotlight на страницах системных параметров.'
  mechanism: 'Windows читает DWORD DisableWindowsSpotlightOnSettings в профиле текущего пользователя и применяет выбранный режим.'
  effect: 'При выключении рекламные и ознакомительные предложения Spotlight не выводятся в «Параметрах».'
  tradeoffs: 'Вместе с предложениями могут исчезнуть подсказки о возможностях Windows.'
  recommendation: 'Отключайте для более лаконичного приложения «Параметры».'
  technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows\CloudContent\DisableWindowsSpotlightOnSettings: 0 — показывать, 1 — не показывать.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 17134
states:
  enabled:
    title: 'Показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\CloudContent'
        value_name: 'DisableWindowsSpotlightOnSettings'
        view: registry64
        value: 0
  disabled:
    title: 'Не показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\CloudContent'
        value_name: 'DisableWindowsSpotlightOnSettings'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [17134, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Policies\Microsoft\Windows\CloudContent'
  value_name: 'DisableWindowsSpotlightOnSettings'
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
