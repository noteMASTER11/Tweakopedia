id: desktop.live-tile-notifications
title: 'Обновления живых плиток'
category: desktop
subcategory: start
kind: setting
summary: 'Разрешает или запрещает приложениям обновлять плитки и их значки в меню «Пуск» Windows 10.'
explanation:
  purpose: 'Разрешает или запрещает приложениям обновлять плитки и их значки в меню «Пуск» Windows 10.'
  mechanism: 'NoTileApplicationNotification блокирует уведомления плиток для приложений и системных компонентов.'
  effect: 'При запрете закреплённые плитки перестают обновлять содержимое и счётчики.'
  tradeoffs: 'На Windows 11 плиток в меню «Пуск» нет; параметр предназначен для Windows 10.'
  recommendation: 'Запрещайте обновления, если динамическое содержимое плиток не используется.'
  technical_details: 'DWORD HKCU\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications\NoTileApplicationNotification.'
compatibility:
  architectures: [x64]
  os: [windows10]
  min_build: 10240
states:
  disabled:
    title: 'Запрещены'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications'
        value_name: NoTileApplicationNotification
        view: registry64
        value: 1
  enabled:
    title: 'Разрешены'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications'
        value_name: NoTileApplicationNotification
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications'
  value_name: NoTileApplicationNotification
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
