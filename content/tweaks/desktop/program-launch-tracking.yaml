id: desktop.program-launch-tracking
title: 'Учёт запусков приложений'
category: desktop
subcategory: start
kind: setting
summary: 'Управляет учётом запусков для персональных списков меню «Пуск».'
explanation:
  purpose: 'Управляет учётом запусков для персональных списков меню «Пуск».'
  mechanism: 'Параметр Start_TrackProgs задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении Windows перестаёт обновлять статистику частоты запуска программ.'
  tradeoffs: 'Подбор часто используемых приложений становится недоступен или менее точен.'
  recommendation: 'Отключайте вместе со списком часто используемых приложений.'
  technical_details: 'Основной объект — 32-битный DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Start_TrackProgs.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: Start_TrackProgs
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: Start_TrackProgs
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: Start_TrackProgs
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
