id: desktop.soft-landing-user
title: 'Мягкие подсказки Windows'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Управляет ненавязчивыми обучающими подсказками при использовании Windows.'
explanation:
  purpose: 'Управляет ненавязчивыми обучающими подсказками при использовании Windows.'
  mechanism: 'Windows или приложение читает DWORD SoftLandingEnabled и применяет соответствующий режим.'
  effect: 'При выключении всплывающие подсказки Soft Landing не отображаются.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте на уже настроенной системе.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\SoftLandingEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SoftLandingEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SoftLandingEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
  value_name: SoftLandingEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
