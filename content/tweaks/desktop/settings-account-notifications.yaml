id: desktop.settings-account-notifications
title: 'Уведомления учётной записи в «Параметрах»'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Управляет уведомлениями об учётной записи внутри приложения «Параметры».'
explanation:
  purpose: 'Управляет уведомлениями об учётной записи внутри приложения «Параметры».'
  mechanism: 'Windows или приложение читает DWORD EnableAccountNotifications и применяет соответствующий режим.'
  effect: 'При выключении «Параметры» не показывают этот класс уведомлений учётной записи.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте, если состояние учётной записи проверяется вручную.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\SystemSettings\AccountNotifications\EnableAccountNotifications: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\SystemSettings\AccountNotifications'
        value_name: EnableAccountNotifications
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\SystemSettings\AccountNotifications'
        value_name: EnableAccountNotifications
        view: registry64
        value: 1
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\SystemSettings\AccountNotifications'
  value_name: EnableAccountNotifications
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
