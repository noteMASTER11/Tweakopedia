id: desktop.start-run-as-different-user
title: 'Запуск от имени другого пользователя в меню «Пуск»'
category: desktop
subcategory: start
kind: setting
summary: 'Показывает команду запуска приложения от имени другой учётной записи.'
explanation:
  purpose: 'Добавляет команду «Запуск от имени другого пользователя» для поддерживающих её приложений.'
  mechanism: 'ShowRunAsDifferentUserInStart включает соответствующую команду в интерфейсе меню «Пуск».'
  effect: 'Можно выбрать другую локальную или доменную учётную запись перед запуском приложения.'
  tradeoffs: 'Команда полезна администраторам, но большинству домашних пользователей не требуется.'
  recommendation: 'Включайте, если регулярно проверяете программы под разными учётными записями.'
  technical_details: 'DWORD HKCU\Software\Policies\Microsoft\Windows\Explorer\ShowRunAsDifferentUserInStart: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Скрывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\Explorer'
        value_name: ShowRunAsDifferentUserInStart
        view: registry64
        value: 0
  enabled:
    title: 'Показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Policies\Microsoft\Windows\Explorer'
        value_name: ShowRunAsDifferentUserInStart
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Policies\Microsoft\Windows\Explorer'
  value_name: ShowRunAsDifferentUserInStart
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

