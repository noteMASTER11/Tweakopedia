id: desktop.system-pane-suggestions
title: 'Системные предложения панели Windows'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Управляет предложениями в системных панелях Windows.'
explanation:
  purpose: 'Управляет предложениями в системных панелях Windows.'
  mechanism: 'Windows или приложение читает DWORD SystemPaneSuggestionsEnabled и применяет соответствующий режим.'
  effect: 'При выключении Windows не добавляет рекомендации через канал SystemPaneSuggestions.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте, если системные рекомендации не используются.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\SystemPaneSuggestionsEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SystemPaneSuggestionsEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SystemPaneSuggestionsEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
  value_name: SystemPaneSuggestionsEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
