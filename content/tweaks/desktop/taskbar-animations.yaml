id: desktop.taskbar-animations
title: 'Анимации панели задач'
category: desktop
subcategory: effects
kind: setting
summary: 'Управляет анимацией элементов панели задач.'
explanation:
  purpose: 'Управляет анимацией элементов панели задач.'
  mechanism: 'Параметр TaskbarAnimations задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении часть переходов и появления элементов становится мгновенной.'
  tradeoffs: 'Интерфейс выглядит менее плавно; измеримый выигрыш обычно невелик.'
  recommendation: 'Отключайте только если анимации субъективно мешают.'
  technical_details: 'Основной объект — 32-битный DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarAnimations.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarAnimations
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarAnimations
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: TaskbarAnimations
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
