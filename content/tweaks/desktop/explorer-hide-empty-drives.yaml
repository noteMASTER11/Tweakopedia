id: desktop.explorer-hide-empty-drives
title: 'Скрывать пустые съёмные диски'
category: desktop
subcategory: explorer
kind: setting
summary: 'Убирает из представления пустые устройства чтения карт и другие съёмные диски.'
explanation:
  purpose: 'Убирает из представления пустые устройства чтения карт и другие съёмные диски.'
  mechanism: 'HideDrivesWithNoMedia скрывает диски, в которых Windows не обнаружила носитель.'
  effect: 'В «Этот компьютер» остаются только доступные накопители и занятые устройства.'
  tradeoffs: 'Пустой картридер не виден до установки карты памяти.'
  recommendation: 'Оставьте включённым, если пустые устройства загромождают список дисков.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\HideDrivesWithNoMedia: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: HideDrivesWithNoMedia
        view: registry64
        value: 0
  enabled:
    title: 'Скрывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: HideDrivesWithNoMedia
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: HideDrivesWithNoMedia
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

