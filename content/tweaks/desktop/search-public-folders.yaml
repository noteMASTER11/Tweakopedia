id: desktop.search-public-folders
title: 'Индексирование общедоступных папок Outlook'
category: desktop
subcategory: search
kind: setting
summary: 'Разрешает индексировать кэшированные общедоступные папки Microsoft Outlook.'
explanation: {purpose: 'Добавляет содержимое общедоступных папок Outlook в локальный поиск.', mechanism: 'Инвертированный параметр PreventIndexingPublicFolders разрешает обработку кэшированных папок.', effect: 'При отключении они не появляются в результатах локального индекса.', tradeoffs: 'Включение увеличивает размер индекса и время первоначальной обработки.', recommendation: 'Включайте только при активной работе с такими папками.', technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\PreventIndexingPublicFolders: 0 — индексировать, 1 — не индексировать.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  enabled: {title: 'Индексировать', operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search', value_name: PreventIndexingPublicFolders, view: registry64, value: 0}]}
  disabled: {title: 'Не индексировать', operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search', value_name: PreventIndexingPublicFolders, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search', value_name: PreventIndexingPublicFolders, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
