id: desktop.explorer-sync-provider-notifications
title: 'Уведомления поставщиков синхронизации в Проводнике'
category: desktop
subcategory: explorer
kind: setting
summary: 'Показывает информационные и рекламные сообщения облачных служб над списком файлов.'
explanation:
  purpose: 'Показывает информационные и рекламные сообщения облачных служб над списком файлов.'
  mechanism: 'ShowSyncProviderNotifications включает уведомления зарегистрированных поставщиков синхронизации.'
  effect: 'В окнах Проводника могут появляться подсказки OneDrive и других облачных компонентов.'
  tradeoffs: 'После отключения пропадут не только предложения, но и часть полезных подсказок синхронизации.'
  recommendation: 'Отключайте, если облачные сообщения в Проводнике мешают.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowSyncProviderNotifications: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 14393
states:
  disabled:
    title: 'Не показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: ShowSyncProviderNotifications
        view: registry64
        value: 0
  enabled:
    title: 'Показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: ShowSyncProviderNotifications
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: ShowSyncProviderNotifications
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

