id: desktop.cloud-search
title: 'Облачные результаты в поиске'
category: desktop
subcategory: search
kind: setting
summary: 'Управляет добавлением облачного содержимого в результаты поиска Windows.'
explanation:
  purpose: 'Управляет добавлением облачного содержимого в результаты поиска Windows.'
  mechanism: 'Параметр AllowCloudSearch задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении поиск не добавляет результаты из поддерживаемых облачных источников.'
  tradeoffs: 'Облачные документы придётся искать отдельно.'
  recommendation: 'Отключайте, если системный поиск должен работать только с локальным содержимым.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowCloudSearch.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 16299
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: AllowCloudSearch
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: AllowCloudSearch
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [16299, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
  value_name: AllowCloudSearch
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
