id: desktop.taskbar-share-window
title: 'Общий доступ к окну с панели задач'
category: desktop
subcategory: taskbar
kind: setting
summary: 'Разрешает выбирать окно для демонстрации непосредственно с панели задач.'
explanation:
  purpose: 'Разрешает выбирать окно для демонстрации непосредственно с панели задач.'
  mechanism: 'TaskbarSn включает интеграцию поддерживающих конференц-приложений с миниатюрами окон.'
  effect: 'В миниатюре окна может появляться команда его демонстрации.'
  tradeoffs: 'Функция заметна только в совместимых приложениях для звонков и конференций.'
  recommendation: 'Оставьте включённым при регулярных видеозвонках; иначе её можно отключить.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarSn: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Отключить'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarSn
        view: registry64
        value: 0
  enabled:
    title: 'Включить'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarSn
        view: registry64
        value: 1
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: TaskbarSn
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

