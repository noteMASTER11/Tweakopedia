id: desktop.search-location
title: 'Использование местоположения в поиске'
category: desktop
subcategory: search
kind: setting
summary: 'Управляет использованием местоположения устройства системным поиском.'
explanation:
  purpose: 'Управляет использованием местоположения устройства системным поиском.'
  mechanism: 'Параметр AllowSearchToUseLocation задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении результаты не адаптируются к текущему местоположению.'
  tradeoffs: 'Локальные рекомендации могут стать менее точными.'
  recommendation: 'Отключайте, если географическая персонализация поиска не нужна.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\AllowSearchToUseLocation.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: AllowSearchToUseLocation
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: AllowSearchToUseLocation
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
  value_name: AllowSearchToUseLocation
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
