id: desktop.explorer-file-extensions
title: 'Расширения имён файлов'
category: desktop
subcategory: explorer
kind: setting
summary: 'Показывает расширения известных типов файлов в Проводнике.'
explanation:
  purpose: 'Показывает расширения известных типов файлов в Проводнике.'
  mechanism: 'HideFileExt инвертированно управляет отображением суффиксов .exe, .txt, .jpg и других известных типов.'
  effect: 'Полное имя и фактический тип файла становятся видны прямо в списке.'
  tradeoffs: 'Имена занимают немного больше места; переименование расширения меняет тип файла.'
  recommendation: 'Показывайте расширения, чтобы различать файлы с одинаковыми базовыми именами.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\HideFileExt: 1 или 0.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Скрывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: HideFileExt
        view: registry64
        value: 1
  enabled:
    title: 'Показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: HideFileExt
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: HideFileExt
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

