id: desktop.search-unc-locations-device
title: 'Добавление сетевых UNC-папок в индекс на компьютере'
category: desktop
subcategory: search
kind: setting
summary: 'Разрешает добавлять сетевые папки формата UNC в параметры индексирования.'
explanation: {purpose: 'Управляет добавлением сетевых расположений в индекс поиска для всего компьютера.', mechanism: 'Политика HideUNCTab скрывает или показывает возможность добавления UNC-путей.', effect: 'При запрете новые сетевые папки нельзя добавить через Панель управления; уже добавленные не удаляются.', tradeoffs: 'Поиск по сетевым папкам может стать медленнее без их индекса.', recommendation: 'Разрешайте, если используется надстройка индексирования сетевых файлов.', technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\HideUNCTab: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search', value_name: HideUNCTab, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search', value_name: HideUNCTab, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search', value_name: HideUNCTab, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
