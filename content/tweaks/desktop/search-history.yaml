id: desktop.search-history
title: 'История поиска на устройстве'
category: desktop
subcategory: search
kind: setting
summary: 'Управляет локальным журналом поисковых запросов Windows.'
explanation:
  purpose: 'Управляет локальным журналом поисковых запросов Windows.'
  mechanism: 'Параметр DeviceHistoryEnabled задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении новые запросы не используются как история поиска.'
  tradeoffs: 'Повторные запросы не предлагаются автоматически.'
  recommendation: 'Отключайте на общих компьютерах или если история не нужна.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search\DeviceHistoryEnabled.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: DeviceHistoryEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
        value_name: DeviceHistoryEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
  value_name: DeviceHistoryEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
