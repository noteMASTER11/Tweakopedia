id: desktop.consumer-account-content
title: 'Облачное содержимое состояния учётной записи'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Управляет облачными сообщениями, связанными с состоянием учётной записи.'
explanation:
  purpose: 'Управляет облачными сообщениями, связанными с состоянием учётной записи.'
  mechanism: 'Параметр DisableConsumerAccountStateContent задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении соответствующие поверхности используют стандартное запасное содержимое.'
  tradeoffs: 'Некоторые актуальные напоминания об учётной записи могут не отображаться.'
  recommendation: 'Отключайте, если облачные сообщения состояния учётной записи не нужны.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableConsumerAccountStateContent.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\CloudContent'
        value_name: DisableConsumerAccountStateContent
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\CloudContent'
        value_name: DisableConsumerAccountStateContent
        view: registry64
        value: 0
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\CloudContent'
  value_name: DisableConsumerAccountStateContent
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false
