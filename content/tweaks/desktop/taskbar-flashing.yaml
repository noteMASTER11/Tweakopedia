id: desktop.taskbar-flashing
title: 'Мигание приложений на панели задач'
category: desktop
subcategory: taskbar
kind: setting
summary: 'Разрешает приложениям привлекать внимание миганием своей кнопки.'
explanation:
  purpose: 'Разрешает приложениям привлекать внимание миганием своей кнопки.'
  mechanism: 'TaskbarFlashing включает визуальное оповещение для окон, запросивших внимание пользователя.'
  effect: 'Кнопки приложений могут мигать при новом событии или завершении операции.'
  tradeoffs: 'Отключение уменьшает отвлечение, но важное окно можно заметить позже.'
  recommendation: 'Оставьте включённым, если полагаетесь на визуальные сигналы фоновых приложений.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarFlashing: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Не разрешать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarFlashing
        view: registry64
        value: 0
  enabled:
    title: 'Разрешать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: TaskbarFlashing
        view: registry64
        value: 1
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: TaskbarFlashing
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

