id: desktop.explorer-desktop-icons
title: 'Значки рабочего стола'
category: desktop
subcategory: explorer
kind: setting
summary: 'Показывает или скрывает все значки и файлы рабочего стола.'
explanation:
  purpose: 'Показывает или скрывает все значки и файлы рабочего стола.'
  mechanism: 'HideIcons инвертированно управляет отрисовкой содержимого рабочего стола оболочкой Explorer.'
  effect: 'Все элементы рабочего стола исчезают из вида или снова отображаются без удаления файлов.'
  tradeoffs: 'При скрытии файлы остаются доступны через папку «Рабочий стол».'
  recommendation: 'Используйте скрытие для чистого рабочего стола или презентаций.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\HideIcons: 1 или 0.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Скрывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: HideIcons
        view: registry64
        value: 1
  enabled:
    title: 'Показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: HideIcons
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: HideIcons
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

