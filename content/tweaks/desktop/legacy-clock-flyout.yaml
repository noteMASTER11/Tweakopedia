id: desktop.legacy-clock-flyout
title: 'Классическая панель даты и времени Windows 10'
category: desktop
subcategory: taskbar
kind: setting
summary: 'Возвращает старую панель часов и календаря в ранних сборках Windows 10.'
explanation:
  purpose: 'Переключает современную панель даты и времени на классический интерфейс предыдущих версий Windows.'
  mechanism: 'UseWin32TrayClockExperience выбирает старую Win32-панель часов.'
  effect: 'Щелчок по часам открывает классический календарь и часы.'
  tradeoffs: 'Механизм удалён из более новых сборок Windows 10 и не действует в Windows 11.'
  recommendation: 'Используйте только на поддерживаемой ранней сборке Windows 10.'
  technical_details: 'DWORD HKLM\Software\Microsoft\Windows\CurrentVersion\ImmersiveShell\UseWin32TrayClockExperience: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10]
  min_build: 10240
  max_build: 10586
states:
  disabled:
    title: 'Современная панель'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Microsoft\Windows\CurrentVersion\ImmersiveShell'
        value_name: UseWin32TrayClockExperience
        view: registry64
        value: 0
  enabled:
    title: 'Классическая панель'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Microsoft\Windows\CurrentVersion\ImmersiveShell'
        value_name: UseWin32TrayClockExperience
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 10586]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Microsoft\Windows\CurrentVersion\ImmersiveShell'
  value_name: UseWin32TrayClockExperience
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

