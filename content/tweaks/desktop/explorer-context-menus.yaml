id: desktop.explorer-context-menus
title: Контекстные меню Проводника и рабочего стола
category: desktop
subcategory: explorer
kind: setting
summary: Разрешает или запрещает контекстные меню Проводника и рабочего стола.
explanation: {purpose: 'Управляет вызовом контекстных меню оболочки.', mechanism: 'NoViewContextMenu инвертированно отключает меню правой кнопки.', effect: 'При запрете контекстные меню рабочего стола и Проводника не открываются.', tradeoffs: 'Многие команды останутся доступны только через панели и клавиатуру.', recommendation: 'Оставьте включёнными для обычной работы.', technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoViewContextMenu.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  disabled: {title: Выключены, operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: NoViewContextMenu, view: registry64, value: 1}]}
  enabled: {title: Включены, operations: [{type: registry.set_dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: NoViewContextMenu, view: registry64, value: 0}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKCU, key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value_name: NoViewContextMenu, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
dependencies: []
conflicts: []
restart: explorer
impact: medium
reversibility: reversible
requires_network: false
