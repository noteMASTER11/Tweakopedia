explanation: {purpose: 'Управляет доступом к вкладке разрешений NTFS.', mechanism: 'NoSecurityTab скрывает вкладку в диалогах свойств.', effect: 'При скрытии пользователь не сможет менять разрешения через Проводник.', tradeoffs: 'Командные средства и существующие разрешения не изменяются.', recommendation: 'Оставьте вкладку доступной на персональном ПК.', technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoSecurityTab.'}
