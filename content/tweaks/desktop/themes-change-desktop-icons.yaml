id: desktop.themes-change-desktop-icons
title: 'Изменение значков рабочего стола темами'
category: desktop
subcategory: effects
kind: setting
summary: 'Разрешает темам Windows заменять стандартные значки рабочего стола.'
explanation:
  purpose: 'Определяет, может ли применяемая тема менять значки системных объектов рабочего стола.'
  mechanism: 'ThemeChangesDesktopIcons управляет применением набора значков из файла темы.'
  effect: 'При отключении выбранные пользователем значки сохраняются при смене темы.'
  tradeoffs: 'Отключение мешает теме полностью воспроизвести предусмотренное автором оформление.'
  recommendation: 'Отключите, если используете собственный набор значков.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\ThemeChangesDesktopIcons: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Запрещать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Themes'
        value_name: ThemeChangesDesktopIcons
        view: registry64
        value: 0
  enabled:
    title: 'Разрешать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Themes'
        value_name: ThemeChangesDesktopIcons
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Themes'
  value_name: ThemeChangesDesktopIcons
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false

