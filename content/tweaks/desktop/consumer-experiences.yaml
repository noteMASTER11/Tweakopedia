id: desktop.consumer-experiences
title: 'Потребительские предложения Microsoft'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Управляет предложениями приложений, плиток и уведомлений для домашних пользователей.'
explanation:
  purpose: 'Управляет предложениями приложений, плиток и уведомлений для домашних пользователей.'
  mechanism: 'Параметр DisableWindowsConsumerFeatures задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении уменьшается число предложений приложений и действий после первоначальной настройки.'
  tradeoffs: 'На некоторых редакциях политика может не применяться системой.'
  recommendation: 'Отключайте, если предлагаемые приложения и уведомления не нужны.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent\DisableWindowsConsumerFeatures.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 14393
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\CloudContent'
        value_name: DisableWindowsConsumerFeatures
        view: registry64
        value: 1
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\CloudContent'
        value_name: DisableWindowsConsumerFeatures
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [14393, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\CloudContent'
  value_name: DisableWindowsConsumerFeatures
  view: registry64
  states:
    1: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: medium
reversibility: reversible
requires_network: false
