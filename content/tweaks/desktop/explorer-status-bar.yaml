id: desktop.explorer-status-bar
title: 'Строка состояния Проводника'
category: desktop
subcategory: explorer
kind: setting
summary: 'Показывает сведения о выбранных объектах в нижней части окна.'
explanation:
  purpose: 'Показывает сведения о выбранных объектах в нижней части окна.'
  mechanism: 'ShowStatusBar включает нижнюю информационную строку классического интерфейса Проводника.'
  effect: 'Внизу окна отображаются количество объектов и краткие сведения о выборе.'
  tradeoffs: 'Строка занимает небольшую часть высоты окна.'
  recommendation: 'Оставьте включённой, если часто проверяете количество выбранных файлов.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowStatusBar: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Скрывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: ShowStatusBar
        view: registry64
        value: 0
  enabled:
    title: 'Показывать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        value_name: ShowStatusBar
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
  value_name: ShowStatusBar
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false

