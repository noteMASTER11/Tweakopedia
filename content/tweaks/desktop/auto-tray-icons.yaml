id: desktop.auto-tray-icons
title: 'Автоматическое скрытие значков области уведомлений'
category: desktop
subcategory: taskbar
kind: setting
summary: 'Разрешает Windows автоматически переносить редко используемые значки в скрытую область.'
explanation:
  purpose: 'Управляет автоматическим размещением значков приложений в области уведомлений.'
  mechanism: 'Windows читает DWORD EnableAutoTray и применяет выбранный режим.'
  effect: 'При выключении автоматического режима значки не скрываются по решению оболочки.'
  tradeoffs: 'Постоянно видимые значки занимают больше места на панели задач.'
  recommendation: 'Выключайте автоматический режим, если хотите видеть все значки сразу.'
  technical_details: 'DWORD HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\EnableAutoTray: 0 — не скрывать автоматически, 1 — скрывать автоматически.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Не скрывать автоматически'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer'
        value_name: 'EnableAutoTray'
        view: registry64
        value: 0
  enabled:
    title: 'Скрывать автоматически'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer'
        value_name: 'EnableAutoTray'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer'
  value_name: 'EnableAutoTray'
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
