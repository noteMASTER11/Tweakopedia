id: desktop.taskbar-context-menu
title: 'Контекстные меню панели задач'
category: desktop
subcategory: taskbar
kind: setting
summary: 'Разрешает или запрещает контекстные меню панели задач и её элементов.'
explanation:
  purpose: 'Управляет меню, вызываемыми правой кнопкой мыши на панели задач и её элементах.'
  mechanism: 'Политика NoTrayContextMenu скрывает контекстные меню панели задач.'
  effect: 'При отключении щелчок правой кнопкой не откроет меню панели задач, часов и кнопок приложений.'
  tradeoffs: 'Те же команды могут оставаться доступны через другие элементы интерфейса.'
  recommendation: 'Оставьте включённым для обычной работы.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoTrayContextMenu: 0 или 1.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Запрещать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer'
        value_name: NoTrayContextMenu
        view: registry64
        value: 1
  enabled:
    title: 'Разрешать'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer'
        value_name: NoTrayContextMenu
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Policies\Explorer'
  value_name: NoTrayContextMenu
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: medium
reversibility: reversible
requires_network: false

