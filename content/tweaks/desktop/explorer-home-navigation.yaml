id: desktop.explorer-home-navigation
title: '«Главная» в области навигации Проводника'
category: desktop
subcategory: explorer
kind: setting
summary: 'Показывает или скрывает раздел «Главная» в левой панели Проводника.'
explanation:
  purpose: 'Показывает или скрывает раздел «Главная» в левой панели Проводника.'
  mechanism: 'Windows или приложение читает DWORD System.IsPinnedToNameSpaceTree и применяет соответствующий режим.'
  effect: 'При выключении узел «Главная» исчезает из дерева навигации; файлы и быстрый доступ не удаляются.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Скрывайте раздел, если Проводник обычно открывается в другом расположении.'
  technical_details: 'DWORD HKCU\Software\Classes\CLSID\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}\System.IsPinnedToNameSpaceTree: 0 — скрыто, 1 — показано.'
compatibility:
  architectures: [x64]
  os: [windows11]
  min_build: 22000
states:
  disabled:
    title: 'Скрыто'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Classes\CLSID\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}'
        value_name: System.IsPinnedToNameSpaceTree
        view: registry64
        value: 0
  enabled:
    title: 'Показано'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Classes\CLSID\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}'
        value_name: System.IsPinnedToNameSpaceTree
        view: registry64
        value: 1
windows_defaults:
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Classes\CLSID\{f874310e-b6b7-47dc-bc84-b9e6b38f5903}'
  value_name: System.IsPinnedToNameSpaceTree
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: explorer
impact: low
reversibility: reversible
requires_network: false
