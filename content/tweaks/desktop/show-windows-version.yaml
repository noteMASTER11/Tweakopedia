id: desktop.show-windows-version
title: Версия Windows на рабочем столе
category: desktop
subcategory: desktop
kind: setting
summary: Показывает редакцию и номер сборки Windows поверх фонового изображения рабочего стола.
explanation:
  purpose: Делает версию установленной системы постоянно видимой без открытия окна сведений о Windows.
  mechanism: Desktop считывает пользовательский параметр PaintDesktopVersion при создании фонового слоя.
  effect: В правой нижней части рабочего стола появляется строка с версией и номером сборки Windows.
  tradeoffs: Служебная надпись остаётся видимой на рабочем столе и может мешать на скриншотах.
  recommendation: Уместно на тестовых системах и при одновременной работе с несколькими сборками Windows.
  technical_details: Изменяется 32-битный DWORD HKCU\Control Panel\Desktop\PaintDesktopVersion. Значение 1 показывает сведения, 0 скрывает их.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: Выключено
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Control Panel\Desktop'
        value_name: PaintDesktopVersion
        view: registry64
        value: 0
  enabled:
    title: Включено
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Control Panel\Desktop'
        value_name: PaintDesktopVersion
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Control Panel\Desktop'
  value_name: PaintDesktopVersion
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false
