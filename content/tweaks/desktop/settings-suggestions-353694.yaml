id: desktop.settings-suggestions-353694
title: 'Предложения в «Параметрах»: канал 353694'
category: desktop
subcategory: spotlight
kind: setting
summary: 'Управляет отдельным каналом предлагаемого содержимого приложения «Параметры».'
explanation:
  purpose: 'Управляет отдельным каналом предлагаемого содержимого приложения «Параметры».'
  mechanism: 'Windows или приложение читает DWORD SubscribedContent-353694Enabled и применяет соответствующий режим.'
  effect: 'При выключении связанный набор рекомендаций не отображается.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте вместе с другими каналами предложений для лаконичного интерфейса.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager\SubscribedContent-353694Enabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SubscribedContent-353694Enabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
        value_name: SubscribedContent-353694Enabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
  value_name: SubscribedContent-353694Enabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
