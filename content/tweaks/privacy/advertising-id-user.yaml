id: privacy.advertising-id-user
title: 'Рекламный идентификатор: пользовательский переключатель'
category: privacy
subcategory: personalization
kind: setting
summary: 'Управляет пользовательским рекламным идентификатором для приложений Windows.'
explanation:
  purpose: 'Управляет пользовательским рекламным идентификатором для приложений Windows.'
  mechanism: 'Windows или приложение читает DWORD Enabled и применяет соответствующий режим.'
  effect: 'При выключении приложения не получают этот идентификатор для персонализации рекламы.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте, если персонализированная реклама приложений не нужна.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo\Enabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo'
        value_name: Enabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo'
        value_name: Enabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo'
  value_name: Enabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
