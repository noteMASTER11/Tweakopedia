id: privacy.implicit-text-collection
title: Сбор образцов печатного ввода
category: privacy
subcategory: personalization
kind: setting
summary: Управляет неявным сбором образцов набранного текста для персонализации ввода.
explanation:
  purpose: Позволяет запретить накопление образцов печатного ввода, используемых персональными предложениями и распознаванием.
  mechanism: Флаг RestrictImplicitTextCollection инвертирует разрешение на неявный сбор печатного ввода.
  effect: При запрете новые образцы набранного текста не добавляются в соответствующее хранилище персонализации.
  tradeoffs: Предложения ввода и персональный словарь могут адаптироваться медленнее.
  recommendation: Запрещайте, если персонализированные предложения ввода не нужны.
  technical_details: Изменяется DWORD HKCU\Software\Microsoft\InputPersonalization\RestrictImplicitTextCollection. Значение 1 запрещает сбор, 0 разрешает.
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: Запрещён
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\InputPersonalization'
        value_name: RestrictImplicitTextCollection
        view: registry64
        value: 1
  enabled:
    title: Разрешён
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\InputPersonalization'
        value_name: RestrictImplicitTextCollection
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\InputPersonalization'
  value_name: RestrictImplicitTextCollection
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: low
reversibility: reversible
requires_network: false
