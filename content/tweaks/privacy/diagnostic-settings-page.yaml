id: privacy.diagnostic-settings-page
title: 'Выбор уровня диагностики в «Параметрах»'
category: privacy
subcategory: diagnostics
kind: setting
summary: 'Разрешает или запрещает пользователю менять уровень диагностических данных через «Параметры».'
explanation:
  purpose: 'Управляет доступностью элементов выбора диагностических данных в интерфейсе Windows.'
  mechanism: 'Windows применяет групповую политику через DWORD DisableTelemetryOptInSettingsUx.'
  effect: 'При запрете соответствующие элементы интерфейса становятся недоступными.'
  tradeoffs: 'Изменить уровень через обычный интерфейс будет нельзя, пока действует политика.'
  recommendation: 'Оставляйте доступным на личном компьютере.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\DataCollection\DisableTelemetryOptInSettingsUx: 0 — доступен, 1 — недоступен.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 17134
states:
  enabled:
    title: 'Доступен'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\DataCollection'
        value_name: 'DisableTelemetryOptInSettingsUx'
        view: registry64
        value: 0
  disabled:
    title: 'Недоступен'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\DataCollection'
        value_name: 'DisableTelemetryOptInSettingsUx'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [17134, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\DataCollection'
  value_name: 'DisableTelemetryOptInSettingsUx'
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
