id: privacy.wer-data-throttling-user
title: 'Ограничение дополнительных данных WER пользователя'
category: privacy
subcategory: diagnostics
kind: setting
summary: 'Выбирает, соблюдать ли штатное ограничение объёма дополнительных данных отчётов.'
explanation: {purpose: 'Управляет частотой и объёмом расширенной отправки для пользователя.', mechanism: 'Параметр BypassDataThrottling отключает стандартное регулирование WER.', effect: 'При обходе подсистема может отправлять больше дополнительных материалов.', tradeoffs: 'Увеличивается сетевой трафик и объём передаваемых данных.', recommendation: 'Оставляйте штатное регулирование, если полный поток отчётов не требуется.', technical_details: 'DWORD HKCU\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\BypassDataThrottling: 0 — регулировать, 1 — обходить.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  managed: {title: 'Штатное регулирование', operations: [{type: registry.set_dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: BypassDataThrottling, view: registry64, value: 0}]}
  bypassed: {title: 'Без ограничения', operations: [{type: registry.set_dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: BypassDataThrottling, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: managed}, {os: windows11, builds: [22000, 26200], state: managed}]
detect: {type: registry.dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: BypassDataThrottling, view: registry64, states: {0: managed, 1: bypassed}, missing_state: managed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
