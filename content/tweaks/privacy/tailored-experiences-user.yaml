id: privacy.tailored-experiences-user
title: 'Персональные рекомендации по диагностическим данным: пользовательский переключатель'
category: privacy
subcategory: personalization
kind: setting
summary: 'Управляет пользовательским согласием на персональные советы на основе диагностических данных.'
explanation:
  purpose: 'Управляет пользовательским согласием на персональные советы на основе диагностических данных.'
  mechanism: 'Windows или приложение читает DWORD TailoredExperiencesWithDiagnosticDataEnabled и применяет соответствующий режим.'
  effect: 'При выключении Windows не использует диагностические данные для этого класса рекомендаций.'
  tradeoffs: 'Принудительное значение имеет приоритет над пользовательским переключателем соответствующей функции.'
  recommendation: 'Отключайте, если персональные советы не нужны.'
  technical_details: 'DWORD HKCU\Software\Microsoft\Windows\CurrentVersion\Privacy\TailoredExperiencesWithDiagnosticDataEnabled: 0 — выключено, 1 — включено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Privacy'
        value_name: TailoredExperiencesWithDiagnosticDataEnabled
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKCU
        key: 'Software\Microsoft\Windows\CurrentVersion\Privacy'
        value_name: TailoredExperiencesWithDiagnosticDataEnabled
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKCU
  key: 'Software\Microsoft\Windows\CurrentVersion\Privacy'
  value_name: TailoredExperiencesWithDiagnosticDataEnabled
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
