id: privacy.device-name-diagnostic-data
title: 'Имя устройства в диагностических данных'
category: privacy
subcategory: diagnostics
kind: setting
summary: 'Разрешает или запрещает включать имя компьютера в диагностические данные Windows.'
explanation:
  purpose: 'Управляет передачей имени устройства вместе с поддерживаемыми диагностическими событиями.'
  mechanism: 'Windows применяет групповую политику через DWORD AllowDeviceNameInTelemetry.'
  effect: 'При запрете диагностические данные не дополняются пользовательским именем компьютера.'
  tradeoffs: 'Администратору организации сложнее сопоставлять события с конкретным устройством.'
  recommendation: 'Запрещайте на личном компьютере, если такое сопоставление не требуется.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\DataCollection\AllowDeviceNameInTelemetry: 0 — не включать, 1 — включать.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 17134
states:
  disabled:
    title: 'Не включать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\DataCollection'
        value_name: 'AllowDeviceNameInTelemetry'
        view: registry64
        value: 0
  enabled:
    title: 'Включать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\DataCollection'
        value_name: 'AllowDeviceNameInTelemetry'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [17134, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\DataCollection'
  value_name: 'AllowDeviceNameInTelemetry'
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
