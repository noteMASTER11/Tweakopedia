id: privacy.wer-additional-data-user
title: 'Дополнительные данные отчётов пользователя'
category: privacy
subcategory: diagnostics
kind: setting
summary: 'Разрешает отправлять дополнительные диагностические материалы после первоначального отчёта.'
explanation: {purpose: 'Управляет вторым этапом сбора сведений о сбое для текущего пользователя.', mechanism: 'Параметр DontSendAdditionalData разрешает либо запрещает запрашиваемые дополнительные данные.', effect: 'При запрете отправляется только базовый набор отчёта.', tradeoffs: 'Меньший объём данных может затруднить определение причины сбоя.', recommendation: 'Запрещайте, если базового отчёта достаточно для вашего сценария.', technical_details: 'DWORD HKCU\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\DontSendAdditionalData: 0 — разрешено, 1 — запрещено.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  allowed: {title: 'Разрешено', operations: [{type: registry.set_dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: DontSendAdditionalData, view: registry64, value: 0}]}
  blocked: {title: 'Запрещено', operations: [{type: registry.set_dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: DontSendAdditionalData, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: allowed}, {os: windows11, builds: [22000, 26200], state: allowed}]
detect: {type: registry.dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: DontSendAdditionalData, view: registry64, states: {0: allowed, 1: blocked}, missing_state: allowed}
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
