id: privacy.wer-battery-throttling-user
title: 'Отправка дополнительных отчётов от батареи для пользователя'
category: privacy
subcategory: diagnostics
kind: setting
summary: 'Разрешает WER обходить ограничение отправки при работе от батареи.'
explanation: {purpose: 'Определяет, откладывать ли расширенную отправку до подключения питания.', mechanism: 'Параметр BypassPowerThrottling отключает энергетическое регулирование WER.', effect: 'При обходе дополнительные данные могут отправляться сразу от батареи.', tradeoffs: 'Передача и обработка отчёта расходуют заряд.', recommendation: 'Оставляйте регулирование включённым на ноутбуках.', technical_details: 'DWORD HKCU\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\BypassPowerThrottling: 0 — учитывать питание, 1 — обходить ограничение.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  managed: {title: 'Учитывать питание', operations: [{type: registry.set_dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: BypassPowerThrottling, view: registry64, value: 0}]}
  bypassed: {title: 'Отправлять от батареи', operations: [{type: registry.set_dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: BypassPowerThrottling, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: managed}, {os: windows11, builds: [22000, 26200], state: managed}]
detect: {type: registry.dword, hive: HKCU, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: BypassPowerThrottling, view: registry64, states: {0: managed, 1: bypassed}, missing_state: managed}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
