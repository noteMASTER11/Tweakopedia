id: privacy.diagnostic-data-viewer
title: 'Просмотр диагностических данных'
category: privacy
subcategory: diagnostics
kind: setting
summary: 'Разрешает или запрещает использование средства просмотра диагностических данных.'
explanation:
  purpose: 'Управляет возможностью просматривать локально сохранённые диагностические события Windows.'
  mechanism: 'Windows применяет групповую политику через DWORD DisableDiagnosticDataViewer.'
  effect: 'При запрете пользователь не сможет включить и открыть просмотр диагностических данных.'
  tradeoffs: 'Проверять состав диагностических событий через штатное средство станет нельзя.'
  recommendation: 'Оставляйте разрешённым, если средство используется для аудита.'
  technical_details: 'DWORD HKLM\Software\Policies\Microsoft\Windows\DataCollection\DisableDiagnosticDataViewer: 0 — разрешён, 1 — запрещён.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 17763
states:
  enabled:
    title: 'Разрешён'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\DataCollection'
        value_name: 'DisableDiagnosticDataViewer'
        view: registry64
        value: 0
  disabled:
    title: 'Запрещён'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'Software\Policies\Microsoft\Windows\DataCollection'
        value_name: 'DisableDiagnosticDataViewer'
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [17763, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'Software\Policies\Microsoft\Windows\DataCollection'
  value_name: 'DisableDiagnosticDataViewer'
  view: registry64
  states:
    0: enabled
    1: disabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
