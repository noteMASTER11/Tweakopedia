id: privacy.publish-user-activities
title: 'Публикация действий пользователя'
category: privacy
subcategory: activity
kind: setting
summary: 'Управляет публикацией действий приложений в системный журнал активности.'
explanation:
  purpose: 'Управляет публикацией действий приложений в системный журнал активности.'
  mechanism: 'Параметр PublishUserActivities задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении новые действия не публикуются в Activity Feed.'
  tradeoffs: 'Функции продолжения работы получают меньше данных.'
  recommendation: 'Отключайте, если журнал активности не используется.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\System\PublishUserActivities.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 16299
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\System'
        value_name: PublishUserActivities
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\Windows\System'
        value_name: PublishUserActivities
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [16299, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Policies\Microsoft\Windows\System'
  value_name: PublishUserActivities
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: none
impact: medium
reversibility: reversible
requires_network: false
