id: privacy.wer-archive-device
title: 'Архив отчётов об ошибках на компьютере'
category: privacy
subcategory: diagnostics
kind: setting
summary: 'Задаёт общее правило локального архивирования Windows Error Reporting.'
explanation: {purpose: 'Управляет сохранением обработанных отчётов на компьютере.', mechanism: 'Системная политика DisableArchive включает или отключает архив WER.', effect: 'При отключении локальные копии завершённых отчётов не сохраняются.', tradeoffs: 'Уменьшается расход диска, но исчезает часть диагностической истории.', recommendation: 'Оставляйте архив включённым, если отчёты используются при анализе сбоев.', technical_details: 'DWORD HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting\DisableArchive: 0 — архив включён, 1 — отключён.'}
compatibility: {architectures: [x64], os: [windows10, windows11], min_build: 10240}
states:
  enabled: {title: 'Архив включён', operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: DisableArchive, view: registry64, value: 0}]}
  disabled: {title: 'Архив отключён', operations: [{type: registry.set_dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: DisableArchive, view: registry64, value: 1}]}
windows_defaults: [{os: windows10, builds: [10240, 19045], state: enabled}, {os: windows11, builds: [22000, 26200], state: enabled}]
detect: {type: registry.dword, hive: HKLM, key: 'SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', value_name: DisableArchive, view: registry64, states: {0: enabled, 1: disabled}, missing_state: enabled}
dependencies: []
conflicts: []
restart: none
impact: low
reversibility: reversible
requires_network: false
