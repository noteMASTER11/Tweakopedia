id: accounts.lsa-protection
title: 'Защищённый процесс LSA'
category: accounts
subcategory: authentication
kind: setting
summary: 'Управляет запуском Local Security Authority в режиме защищённого процесса.'
explanation:
  purpose: 'Управляет запуском Local Security Authority в режиме защищённого процесса.'
  mechanism: 'Параметр RunAsPPL задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При включении LSASS запускается как Protected Process Light и ограничивает загрузку несовместимых модулей.'
  tradeoffs: 'Старые поставщики учётных данных и сторонние модули входа могут оказаться несовместимыми.'
  recommendation: 'Включайте после проверки используемых модулей входа и шифрования.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Lsa'
        value_name: RunAsPPL
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Lsa'
        value_name: RunAsPPL
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Lsa'
  value_name: RunAsPPL
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
