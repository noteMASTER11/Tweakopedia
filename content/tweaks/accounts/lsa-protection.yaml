id: accounts.lsa-protection
title: 'Защищённый процесс LSA'
category: accounts
subcategory: authentication
kind: setting
summary: 'Управляет запуском Local Security Authority в режиме защищённого процесса.'
explanation:
  purpose: 'LSA проверяет пароли и создаёт сеансы входа в Windows. Этот параметр изолирует процесс LSASS от обычных программ и чаще всего используется, чтобы посторонние модули не могли незаметно подключиться к обработке учётных данных.'
  mechanism: 'Параметр RunAsPPL задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'После включения LSASS запускается как Protected Process Light. Для обычного пользователя интерфейс входа не меняется, но неподходящим сторонним компонентам становится сложнее внедряться в этот процесс.'
  tradeoffs: 'Старые поставщики учётных данных, нестандартные экраны входа и отдельные модули шифрования могут оказаться несовместимыми. Проблема обычно проявляется уже при следующем входе или после перезагрузки.'
  recommendation: 'На обычном домашнем ПК со стандартным входом Windows параметр можно включить. Если используются корпоративный клиент входа, токен, старое шифрование диска или сторонняя биометрия, сначала проверьте их совместимость.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Lsa'
        value_name: RunAsPPL
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SYSTEM\CurrentControlSet\Control\Lsa'
        value_name: RunAsPPL
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SYSTEM\CurrentControlSet\Control\Lsa'
  value_name: RunAsPPL
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
