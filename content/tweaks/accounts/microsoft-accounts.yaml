id: accounts.microsoft-accounts
title: 'Подключение учётных записей Microsoft'
category: accounts
subcategory: microsoft
kind: setting
summary: 'Управляет возможностью добавлять и использовать подключённые учётные записи Microsoft.'
explanation:
  purpose: 'Управляет возможностью добавлять и использовать подключённые учётные записи Microsoft.'
  mechanism: 'Параметр NoConnectedUser задаёт описанное поведение Windows для этого компьютера или пользователя.'
  effect: 'При выключении вход и добавление облачной учётной записи ограничиваются; локальные записи продолжают работать.'
  tradeoffs: 'Store, OneDrive и приложения, которым нужен такой вход, могут потерять часть функций.'
  recommendation: 'Отключайте только на компьютере с локальными или доменными учётными записями.'
  technical_details: 'Основной объект — 32-битный DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\NoConnectedUser.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Запрещены'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: NoConnectedUser
        view: registry64
        value: 3
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\MicrosoftAccount'
        value_name: DisableUserAuth
        view: registry64
        value: 1
  enabled:
    title: 'Разрешены'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: NoConnectedUser
        view: registry64
        value: 0
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Policies\Microsoft\MicrosoftAccount'
        value_name: DisableUserAuth
        view: registry64
        value: 0
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: NoConnectedUser
  view: registry64
  states:
    3: disabled
    0: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: sign_out
impact: high
reversibility: reversible
requires_network: false
