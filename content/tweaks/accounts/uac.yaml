id: accounts.uac
title: 'Контроль учётных записей (UAC)'
category: accounts
subcategory: uac
kind: setting
summary: 'Включает основной механизм разделения обычных и повышенных прав.'
explanation:
  purpose: 'UAC отвечает за знакомый запрос «Разрешить этому приложению вносить изменения?». Даже учётная запись администратора обычно работает с обычными правами, а установщики и системные утилиты получают расширенные права только после отдельного подтверждения.'
  mechanism: 'EnableLUA переводит администраторов в режим подтверждения административных действий.'
  effect: 'При включении повседневные программы запускаются без расширенных прав и запрашивают их только для конкретного действия. Это также сохраняет штатную работу Store, современных приложений и других компонентов, которые рассчитывают на включённый UAC.'
  tradeoffs: 'Выключение не просто убирает всплывающий вопрос: оно меняет модель запуска программ, требует перезагрузки и способно нарушить работу части Windows. Любая запущенная программа администратора получает существенно больше возможностей изменить систему без дополнительного подтверждения.'
  recommendation: 'Оставляйте UAC включённым на обычном компьютере. Если мешает частота запросов, настройте поведение запросов отдельными параметрами, а не выключайте весь механизм.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA: 1 — включено, 0 — выключено.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableLUA
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableLUA
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: EnableLUA
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
