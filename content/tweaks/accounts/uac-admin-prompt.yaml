id: accounts.uac-admin-prompt
title: 'Запрос повышения прав для администраторов'
category: accounts
subcategory: uac
kind: setting
summary: 'Выбирает поведение запроса UAC для пользователей из группы администраторов.'
explanation:
  purpose: 'Определяет, что увидит администратор, когда установщик или системная утилита попросит расширенные права. Твик позволяет выбрать между коротким подтверждением, вводом пароля и автоматическим выполнением без вопроса.'
  mechanism: 'ConsentPromptBehaviorAdmin задаёт один из шести режимов подтверждения или ввода учётных данных.'
  effect: 'Выбранный режим применяется ко всем запросам повышения для администраторов. Например, установка программы сможет требовать только нажатия «Да», обязательного ввода данных либо вообще не показывать запрос.'
  tradeoffs: 'Автоматическое повышение убирает видимую паузу перед изменением системы. Обязательный ввод данных, наоборот, делает каждую установку и административную настройку более трудоёмкой.'
  recommendation: 'Для личного компьютера подходит подтверждение запросов программ не из Windows. Ввод данных полезен на общем компьютере, а автоматическое повышение стоит оставлять только для изолированного тестового окружения.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin, значения 0–5.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  no_prompt:
    title: 'Повышать без запроса'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ConsentPromptBehaviorAdmin
        view: registry64
        value: 0
  credentials_secure:
    title: 'Учётные данные на изолированном рабочем столе'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ConsentPromptBehaviorAdmin
        view: registry64
        value: 1
  consent_secure:
    title: 'Подтверждение на изолированном рабочем столе'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ConsentPromptBehaviorAdmin
        view: registry64
        value: 2
  credentials:
    title: 'Запрос учётных данных'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ConsentPromptBehaviorAdmin
        view: registry64
        value: 3
  consent:
    title: 'Запрос подтверждения'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ConsentPromptBehaviorAdmin
        view: registry64
        value: 4
  non_windows_consent:
    title: 'Подтверждение для программ не из Windows'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ConsentPromptBehaviorAdmin
        view: registry64
        value: 5
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: non_windows_consent
  - os: windows11
    builds: [22000, 26200]
    state: non_windows_consent
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: ConsentPromptBehaviorAdmin
  view: registry64
  states:
    0: no_prompt
    1: credentials_secure
    2: consent_secure
    3: credentials
    4: consent
    5: non_windows_consent
  missing_state: non_windows_consent
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
