id: accounts.uac-uiaccess-desktop-toggle
title: 'UIAccess без изолированного рабочего стола'
category: accounts
subcategory: uac
kind: setting
summary: 'Разрешает UIAccess-программам переносить запрос UAC на обычный рабочий стол.'
explanation:
  purpose: 'Нужен отдельным программам специальных возможностей и удалённой помощи, которым требуется взаимодействовать с запросом UAC. Он разрешает такой программе перенести окно подтверждения с отдельного рабочего стола на обычный.'
  mechanism: 'EnableUIADesktopToggle позволяет программам специальных возможностей отключать изолированный рабочий стол для запроса.'
  effect: 'После включения совместимое средство сможет показать и обслужить запрос повышения там же, где открыты остальные окна. Это может помочь оператору удалённой поддержки или пользователю программы доступности подтвердить действие без потери изображения.'
  tradeoffs: 'Запрос перестаёт быть отделён от остальных окон текущего рабочего стола. Обычным приложениям и большинству программ удалённого доступа эта возможность не требуется.'
  recommendation: 'Оставляйте выключённым, пока конкретная программа специальных возможностей или удалённой помощи не потребует этот режим. Не включайте его просто для устранения любого чёрного экрана — сначала проверьте настройку изолированного рабочего стола.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableUIADesktopToggle.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Не разрешать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableUIADesktopToggle
        view: registry64
        value: 0
  enabled:
    title: 'Разрешать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableUIADesktopToggle
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: EnableUIADesktopToggle
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
