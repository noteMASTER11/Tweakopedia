id: accounts.uac-signed-executables-only
title: 'Повышение прав только для подписанных программ'
category: accounts
subcategory: uac
kind: setting
summary: 'Разрешает повышение прав лишь исполняемым файлам с проверяемой цифровой подписью.'
explanation:
  purpose: 'Ограничивает административный запуск программами, чью цифровую подпись может проверить Windows. Обычно такой режим используют на строго управляемых рабочих местах с заранее известным набором установщиков и утилит.'
  mechanism: 'ValidateAdminCodeSignatures требует успешной проверки подписи перед выдачей административных прав.'
  effect: 'После включения одного подтверждения UAC недостаточно: неподписанный файл не сможет получить административные права. Это исключает запуск случайных самодельных утилит с повышением, но одновременно вводит жёсткое требование ко всему программному набору.'
  tradeoffs: 'Многие легитимные старые, портативные и самостоятельно собранные программы не имеют подходящей подписи. Их установка или административный запуск перестанут работать, даже если пользователь полностью доверяет файлу.'
  recommendation: 'На обычном домашнем ПК оставляйте параметр выключенным. Включайте только после проверки всех используемых установщиков, служебных программ и собственных сценариев развёртывания.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ValidateAdminCodeSignatures.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Не требовать'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ValidateAdminCodeSignatures
        view: registry64
        value: 0
  enabled:
    title: 'Требовать подпись'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: ValidateAdminCodeSignatures
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: ValidateAdminCodeSignatures
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
