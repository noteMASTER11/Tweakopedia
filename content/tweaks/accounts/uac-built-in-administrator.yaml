id: accounts.uac-built-in-administrator
title: 'UAC для встроенной учётной записи Administrator'
category: accounts
subcategory: uac
kind: setting
summary: 'Применяет режим подтверждения действий к встроенной учётной записи Administrator.'
explanation:
  purpose: 'В Windows есть отдельная встроенная учётная запись с именем Administrator — это не то же самое, что обычный пользователь из группы администраторов. Параметр определяет, будет ли эта специальная запись также получать запросы UAC.'
  mechanism: 'FilterAdministratorToken включает Admin Approval Mode для встроенной учётной записи Administrator.'
  effect: 'При включении даже встроенный Administrator обычно запускает программы без расширенных прав и подтверждает их повышение отдельно. Это делает его поведение ближе к обычной административной учётной записи.'
  tradeoffs: 'При выключении все программы в этой учётной записи сразу получают полные административные права. При включении старые сценарии обслуживания, рассчитанные на неограниченный Administrator, могут потребовать явного запуска от имени администратора.'
  recommendation: 'Если встроенная запись отключена и не используется, менять параметр незачем. Если она применяется для ремонта или администрирования, оставляйте режим подтверждения включённым, кроме краткого контролируемого обслуживания.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\FilterAdministratorToken.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: FilterAdministratorToken
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: FilterAdministratorToken
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: disabled
  - os: windows11
    builds: [22000, 26200]
    state: disabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: FilterAdministratorToken
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: disabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
