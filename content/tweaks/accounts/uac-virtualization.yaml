id: accounts.uac-virtualization
title: 'Виртуализация файлов и реестра UAC'
category: accounts
subcategory: uac
kind: setting
summary: 'Перенаправляет записи старых программ из системных каталогов в профиль пользователя.'
explanation:
  purpose: 'Перенаправляет записи старых программ из системных каталогов в профиль пользователя.'
  mechanism: 'EnableVirtualization включает совместимое перенаправление неудачных записей в защищённые ветви и каталоги.'
  effect: 'Старые 32-битные программы без современного манифеста могут сохранять настройки без административных прав.'
  tradeoffs: 'Перенаправленные данные могут быть неочевидны при поиске файлов и диагностике приложения.'
  recommendation: 'Оставляйте включённым для совместимости со старыми программами.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableVirtualization.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableVirtualization
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableVirtualization
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: EnableVirtualization
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
