id: accounts.uac-virtualization
title: 'Виртуализация файлов и реестра UAC'
category: accounts
subcategory: uac
kind: setting
summary: 'Перенаправляет записи старых программ из системных каталогов в профиль пользователя.'
explanation:
  purpose: 'Помогает старым программам и играм, которые пытаются сохранять настройки прямо в Program Files или системную часть реестра. Windows незаметно перенаправляет такую запись в профиль текущего пользователя.'
  mechanism: 'EnableVirtualization включает совместимое перенаправление неудачных записей в защищённые ветви и каталоги.'
  effect: 'Старая 32-битная программа может сохранить конфигурацию без постоянного запуска от имени администратора. У каждого пользователя при этом может появиться собственная перенаправленная копия файлов или параметров.'
  tradeoffs: 'Настройка, которую программа считает общей, фактически может оказаться только в одном профиле. При переносе данных или поиске конфигурации нужно учитывать каталог VirtualStore и соответствующее перенаправление реестра.'
  recommendation: 'Оставляйте включённым для старых программ и игр. Отключение имеет смысл при диагностике перенаправленных файлов либо в среде, где запускаются только современные приложения с корректными правами доступа.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableVirtualization.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableVirtualization
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableVirtualization
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: EnableVirtualization
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
