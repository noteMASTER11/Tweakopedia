id: accounts.uac-uiaccess-secure-paths
title: 'UIAccess только из системных каталогов'
category: accounts
subcategory: uac
kind: setting
summary: 'Ограничивает запуск UIAccess-программ доверенными системными каталогами.'
explanation:
  purpose: 'Определяет, откуда разрешено запускать программы с возможностью UIAccess — например экранные клавиатуры и другие средства, взаимодействующие с повышенными окнами. Штатный режим требует установки такой программы в Windows или Program Files.'
  mechanism: 'EnableSecureUIAPaths разрешает UIAccess только приложениям из Windows и Program Files.'
  effect: 'При включённом ограничении портативный файл из папки загрузок, рабочего стола или флешки не получит UIAccess. Установленная в стандартный каталог программа продолжит работать в предусмотренном режиме.'
  tradeoffs: 'Портативные средства специальных возможностей могут перестать нажимать кнопки и читать элементы в окнах с повышенными правами. Простое перемещение проверенной программы в Program Files часто решает проблему без снятия ограничения.'
  recommendation: 'Оставляйте ограничение включённым. Выключайте его только для конкретного проверенного портативного средства, если его невозможно установить в стандартный каталог и ему действительно нужен UIAccess.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableSecureUIAPaths.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Разрешить любой путь'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableSecureUIAPaths
        view: registry64
        value: 0
  enabled:
    title: 'Только системные каталоги'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableSecureUIAPaths
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: EnableSecureUIAPaths
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
