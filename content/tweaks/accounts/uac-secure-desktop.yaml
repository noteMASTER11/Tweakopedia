id: accounts.uac-secure-desktop
title: 'Изолированный рабочий стол для запросов UAC'
category: accounts
subcategory: uac
kind: setting
summary: 'Показывает запросы повышения прав на отдельном затемнённом рабочем столе.'
explanation:
  purpose: 'Управляет знакомым затемнением экрана при появлении запроса UAC. Затемнение означает, что окно подтверждения открыто на отдельном системном рабочем столе, а не поверх обычных программ.'
  mechanism: 'PromptOnSecureDesktop переключает запрос UAC между изолированным и обычным рабочим столом.'
  effect: 'При включении остальные окна временно перестают принимать ввод, пока пользователь не ответит на запрос. При выключении запрос появляется как обычное окно, поэтому его легче видеть в удалённой сессии или записи экрана.'
  tradeoffs: 'Переключение на отдельный рабочий стол может давать короткую паузу, чёрный кадр в записи или недоступный экран в некоторых программах удалённой помощи. На обычную работу после закрытия запроса это не влияет.'
  recommendation: 'Для обычного ПК оставляйте затемнение включённым. Переносите запросы на обычный рабочий стол только при конкретной проблеме с удалённым управлением, экранным диктором или записью действий.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Обычный рабочий стол'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: PromptOnSecureDesktop
        view: registry64
        value: 0
  enabled:
    title: 'Изолированный рабочий стол'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: PromptOnSecureDesktop
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: PromptOnSecureDesktop
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
