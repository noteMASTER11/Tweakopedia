id: accounts.uac-installer-detection
title: 'Распознавание установщиков UAC'
category: accounts
subcategory: uac
kind: setting
summary: 'Разрешает Windows распознавать установщики и предлагать повышение прав.'
explanation:
  purpose: 'Помогает запускать старые установщики, которые ещё не умеют сами сообщать Windows о необходимости административных прав. Система пытается узнать такой файл по имени и поведению и показывает запрос UAC автоматически.'
  mechanism: 'EnableInstallerDetection включает эвристику обнаружения установочных пакетов, которым нужны административные права.'
  effect: 'После включения файлы вроде старых setup.exe чаще сразу получают подходящий запрос повышения. Пользователю реже приходится повторно запускать установщик вручную через пункт «Запуск от имени администратора».'
  tradeoffs: 'Редкая обычная программа с похожим именем или поведением может быть ошибочно принята за установщик. После отключения старые установщики способны завершаться ошибкой записи в Program Files или системный реестр.'
  recommendation: 'Оставляйте включённым на домашнем ПК, особенно если устанавливаете старые программы и игры. Отключение уместно в управляемой среде, где запускаются только современные пакеты с корректными манифестами.'
  technical_details: 'DWORD HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableInstallerDetection.'
compatibility:
  architectures: [x64]
  os: [windows10, windows11]
  min_build: 10240
states:
  disabled:
    title: 'Выключено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableInstallerDetection
        view: registry64
        value: 0
  enabled:
    title: 'Включено'
    operations:
      - type: registry.set_dword
        hive: HKLM
        key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        value_name: EnableInstallerDetection
        view: registry64
        value: 1
windows_defaults:
  - os: windows10
    builds: [10240, 19045]
    state: enabled
  - os: windows11
    builds: [22000, 26200]
    state: enabled
detect:
  type: registry.dword
  hive: HKLM
  key: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
  value_name: EnableInstallerDetection
  view: registry64
  states:
    0: disabled
    1: enabled
  missing_state: enabled
dependencies: []
conflicts: []
restart: reboot
impact: high
reversibility: reversible
requires_network: false
