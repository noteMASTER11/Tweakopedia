id: power.processor-minimum-ac
title: Минимальное состояние процессора от сети
category: power
subcategory: processor
kind: setting
summary: Выбирает минимальное состояние процессора для питания от сети.
explanation:
  purpose: Управляет нижней границей производительности процессора.
  mechanism: Изменяет AC-индекс параметра в активной схеме питания.
  effect: Процессор может сильнее снижать или удерживать частоту.
  tradeoffs: Высокое значение увеличивает энергопотребление и нагрев.
  recommendation: Использовать штатное значение без конкретной задачи.
  technical_details: PowrProf AC value index для GUID параметра процессора.
